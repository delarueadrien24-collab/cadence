<title>Cadence</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Atkinson+Hyperlegible:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Concept : appli téléphone en une colonne. Ardoise + ambre (celle du programme Canva), couleur par type d'activité. */
:root{
  --bg:#F3F5F7; --surface:#FFFFFF; --ink:#17212B; --muted:#5A6773; --line:#DCE1E6; --soft:#E8ECF0;
  --accent:#F59A1B; --accent-ink:#17212B; --good:#1D7A4D; --warn:#B3261E;
  --head-bg:#FFFFFF; --head-fg:#17212B; --tl:40%; --ts:65%; --logo-bg:var(--accent); --logo-fg:var(--accent-ink); color-scheme:light;
  --f-head:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
}
/* ambiances (DA alternatives) */
:root[data-theme="pro"]{--bg:#F3F5F7;--surface:#FFFFFF;--ink:#17212B;--muted:#5A6773;--line:#DCE1E6;--soft:#E8ECF0;--accent:#F59A1B;--accent-ink:#17212B;--good:#1D7A4D;--warn:#B3261E;--head-bg:#FFFFFF;--head-fg:#17212B;--tl:40%;--ts:65%;--logo-bg:var(--accent);--logo-fg:var(--accent-ink);
  --f-head:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;--f-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif}
:root[data-theme="pro"] body{font-size:16px;line-height:1.5;letter-spacing:-.003em}
:root[data-theme="pro"] h1,:root[data-theme="pro"] h2,:root[data-theme="pro"] h3,:root[data-theme="pro"] .big,:root[data-theme="pro"] .presc,:root[data-theme="pro"] .ac b{letter-spacing:-.015em;font-weight:650}
:root[data-theme="pro"] .top{border-bottom-color:var(--line)}
:root[data-theme="pro"] .top h1{font-size:17px;font-weight:700}
:root[data-theme="pro"] .top small{font-size:12px}
:root[data-theme="pro"] .lnk{text-decoration:none;font-size:14px;font-weight:600;color:var(--muted);padding:10px 8px}
:root[data-theme="pro"] .card,:root[data-theme="pro"] .ex,:root[data-theme="pro"] .ac,:root[data-theme="pro"] .cell,:root[data-theme="pro"] .demo{border-radius:8px;box-shadow:0 1px 2px rgba(11,18,32,.04)}
:root[data-theme="pro"] .ac{border-left-width:4px;min-height:60px}
:root[data-theme="pro"] .ac b{font-size:16px}
:root[data-theme="pro"] .btn{border-radius:8px;border-width:1px;font-weight:600;font-size:16px}
:root[data-theme="pro"] .btn.ghost{border-color:#C5CAD3;background:var(--surface)}
:root[data-theme="pro"] .btn.danger{background:transparent}
:root[data-theme="pro"] .chip,:root[data-theme="pro"] .pick label,:root[data-theme="pro"] .chk{border-radius:8px;border-width:1px;border-color:#C5CAD3;font-weight:600}
:root[data-theme="pro"] .chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
:root[data-theme="pro"] .tag{border-radius:5px;font-size:12px;padding:2px 8px;letter-spacing:.01em}
:root[data-theme="pro"] .pill{border-radius:5px}
:root[data-theme="pro"] .rpe{border-radius:5px}
:root[data-theme="pro"] .wk button,:root[data-theme="pro"] .rg button,:root[data-theme="pro"] .stepper button,:root[data-theme="pro"] .stepper input,:root[data-theme="pro"] label.f>input,:root[data-theme="pro"] label.f>select,:root[data-theme="pro"] label.f>textarea{border-width:1px;border-color:#C5CAD3;border-radius:8px}
:root[data-theme="pro"] .stepper button{font-weight:600}
:root[data-theme="pro"] .day.today .dl b{border-radius:6px}
:root[data-theme="pro"] .eyebrow{font-size:11px;letter-spacing:.1em;font-weight:600}
:root[data-theme="pro"] .tabs button{font-size:14px;font-weight:600;border-top-width:3px}
:root[data-theme="pro"] .pips i{height:8px;border-radius:2px}
:root[data-theme="pro"] .prog,:root[data-theme="pro"] .prog i{border-radius:2px}
:root[data-theme="pro"] .streak{border-left-color:var(--accent)}
:root[data-theme="pro"] .ac .cm{width:22px;height:22px;font-size:13px;top:14px}
:root[data-theme="pro"] details.how summary{border-radius:8px;background:var(--soft);font-size:15px}
:root[data-theme="pro"] details.how summary .i{width:20px;height:20px;font-size:12px;background:var(--ink)}
:root[data-theme="pro"] .sh{border-radius:14px 14px 0 0}
:root[data-theme="pro"] .bars i{background:var(--accent);border-radius:3px 3px 0 0}
:root[data-theme="pro"] .ex.done{box-shadow:inset 4px 0 0 var(--good)}
:root[data-theme="pro"] .login-hero{background:var(--surface);color:var(--ink);border-radius:0;border-bottom:1px solid var(--line);text-align:left;padding:calc(36px + env(safe-area-inset-top,0px)) 0 28px}
:root[data-theme="pro"] .login-hero::after{display:none}
:root[data-theme="pro"] .login-hero .logo{margin:0}
:root[data-theme="pro"] .login-hero h1{font-size:34px;margin-top:16px;font-weight:700}
:root[data-theme="pro"] .login-hero p{margin:6px 0 0;max-width:none;color:var(--muted);opacity:1;font-size:16px}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.45 var(--f-body);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--head-bg);z-index:30}
.wk button:disabled{opacity:.3;cursor:default}
h1,h2,h3{font-family:var(--f-head);line-height:1.12;margin:0;text-wrap:balance}
p{margin:0 0 .6em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.in{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);background:var(--head-bg);color:var(--head-fg);z-index:20}
.top .in{display:flex;align-items:center;gap:10px;min-height:58px}
.top h1{font-size:20px;font-weight:800;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .hl{flex:1;min-width:0}
.top small{display:block;font:400 13px var(--f-body);opacity:.75}
.lnk{background:none;border:0;color:inherit;text-decoration:underline;text-underline-offset:3px;padding:10px 4px;font-size:15px}
.back{background:none;border:0;color:inherit;font:800 32px/1 var(--f-head);padding:0 8px 4px 0}
.main{padding-top:16px;padding-bottom:120px;display:flex;flex-direction:column;gap:14px}
.muted{color:var(--muted)}
.small{font-size:14px}
.h2{font-size:20px;font-weight:800}
.eyebrow{font:700 12px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* barres fixes */
.fixed{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:15;padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .in{display:flex}
.tabs button{flex:1;background:none;border:0;border-top:4px solid transparent;padding:14px 4px;font-weight:700;font-size:16px;color:var(--muted)}
.tabs button[aria-current="page"]{border-top-color:var(--accent);color:var(--ink)}
.act-bar .in{padding-top:10px;padding-bottom:10px}

/* boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:12px;border:2px solid var(--ink);background:var(--ink);color:var(--surface);font:700 17px var(--f-body)}
.btn.amber{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.sm{min-height:40px;padding:0 14px;font-size:15px}
.btn.block{display:flex;width:100%}
.btn.danger{background:transparent;border-color:var(--warn);color:var(--warn)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:0}

/* types d'activité : une teinte par type */
.t{--c:hsl(var(--h) var(--ts) var(--tl));--c-bg:hsl(var(--h) var(--ts) var(--tl) / .13)}
.tag{display:inline-block;background:var(--c-bg);color:var(--c);border-radius:99px;padding:1px 10px;font-weight:700;font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:2px 16px 6px}
.chip{flex:none;min-height:40px;padding:0 14px;border-radius:99px;border:2px solid var(--line);background:var(--surface);font-weight:700;font-size:15px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}

/* semaine athlète */
.wk{display:flex;align-items:center;gap:8px}
.wk button{width:44px;height:44px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font:800 22px var(--f-head)}
.wk div{flex:1;text-align:center}
.wk b{font:800 18px var(--f-head);display:block}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sum .card{padding:12px 14px}
.sum b{display:block;font:800 28px/1.1 var(--f-head);font-variant-numeric:tabular-nums}
.day{display:grid;grid-template-columns:56px 1fr;gap:10px}
.dl{padding-top:12px;text-align:center;font:800 13px var(--f-body);text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.dl b{display:block;font:800 24px/1 var(--f-head);color:var(--ink);letter-spacing:0}
.day.today .dl b{background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:4px 0;margin-top:2px}
.day .stack{display:flex;flex-direction:column;gap:8px;min-width:0}
.rest{color:var(--muted);font-size:15px;padding:14px 0}
.ac{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:12px;padding:12px 14px;min-height:64px}
.ac b{font:700 18px var(--f-head);display:block}
.ac .st{display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap;font-size:14px}
.ok{color:var(--good);font-weight:700}
.rpe{display:inline-block;min-width:38px;text-align:center;border-radius:99px;padding:1px 10px;font-weight:700;font-size:14px;background:var(--soft)}
.rpe.hi{background:var(--warn);color:#fff}

/* historique */
.bars{display:flex;align-items:flex-end;gap:8px;height:110px;padding-top:6px}
.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%;font-size:12px;color:var(--muted)}
.bars i{display:block;width:100%;background:var(--accent);border-radius:6px 6px 0 0;min-height:3px}
.bars div.cur i{background:var(--ink)}
.logi{padding:10px 0;border-top:1px solid var(--line);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;display:block}
.logi:first-of-type{border-top:0}
.logi q{display:block;font-style:italic;color:var(--muted);quotes:none;margin-top:4px;font-size:15px}

/* détail séance */
.ex{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.ex.done{box-shadow:inset 5px 0 0 var(--good)}
.ex img{display:block;width:100%;aspect-ratio:16/9;object-fit:contain;background:#fff;border-bottom:1px solid var(--line)}
.exb{padding:12px 14px 14px}
.exh{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.exh h3{font-size:20px;padding-top:6px}
.chk{flex:none;min-height:44px;padding:0 14px;border-radius:99px;border:2px solid var(--line);background:var(--surface);font-weight:700}
.chk[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:#fff}
.presc{font:800 25px/1.1 var(--f-head);margin:8px 0 2px}
.presc small{font:400 15px var(--f-body);color:var(--muted);margin-left:8px}
.stepper{display:flex;align-items:center;gap:8px;margin-top:10px}
.stepper button{width:54px;height:54px;border-radius:12px;border:2px solid var(--ink);background:var(--surface);font:800 28px/1 var(--f-head)}
.stepper button:active{background:var(--accent);border-color:var(--accent)}
.stepper input{width:96px;height:54px;text-align:center;font:800 28px var(--f-head);border:2px solid var(--ink);border-radius:12px;background:var(--surface);font-variant-numeric:tabular-nums}
details.how{margin-top:10px;border-top:1px solid var(--line)}
details.how summary{min-height:44px;display:flex;align-items:center;font-weight:700;cursor:pointer}
details.how div{margin:6px 0}
details.how b{display:block;font-size:13px;color:var(--muted)}
.prog{height:6px;background:var(--soft);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);width:0}

/* calendrier coach */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dn{text-align:center;font-size:12px;color:var(--muted);padding-bottom:2px}
.cell{min-height:60px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:5px 4px;display:flex;flex-direction:column;align-items:center;gap:4px}
.cell.out{opacity:.4}
.cell.today{border:2px solid var(--accent)}
.cell span{font:700 13px var(--f-body)}
.dots{display:flex;flex-wrap:wrap;gap:3px;justify-content:center}
.dot{width:9px;height:9px;border-radius:50%;background:var(--c);border:2px solid var(--c)}
.dot.todo{background:transparent}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--muted)}
.legend .dot{display:inline-block;vertical-align:-1px;margin-right:5px}

/* feuilles */
.ov{position:fixed;inset:0;background:rgba(10,16,22,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sh{background:var(--bg);width:100%;max-width:520px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:16px max(16px,env(safe-area-inset-left,0px)) calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.sh h2{font-size:22px}
label.f{display:block;font-weight:700;font-size:15px}
label.f>input,label.f>select,label.f>textarea{display:block;width:100%;margin-top:5px;padding:11px 12px;border:2px solid var(--line);border-radius:10px;background:var(--surface);font-weight:400;font-size:17px}
label.f>textarea{min-height:84px;resize:vertical}
.rg{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.rg button{min-height:48px;border-radius:10px;border:2px solid var(--line);background:var(--surface);font:800 18px var(--f-head)}
.rg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pick{display:flex;flex-wrap:wrap;gap:8px}
.pick label{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border:2px solid var(--line);border-radius:99px;background:var(--surface);font-weight:700}
.pick input{width:20px;height:20px;accent-color:var(--good)}
.li{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.sw{width:22px;height:22px;border-radius:6px;background:var(--c);flex:none}
.hues{display:flex;gap:8px}
.hues label{width:40px;height:40px;border-radius:10px;background:hsl(var(--h) var(--ts) var(--tl));display:flex;align-items:center;justify-content:center;border:3px solid transparent}
.hues input{position:absolute;opacity:0}
.hues label:has(input:checked){border-color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;z-index:60;max-width:90%;font-size:15px}

.big{font:800 24px var(--f-head);font-variant-numeric:tabular-nums}
.pill{display:inline-block;border-radius:99px;padding:1px 10px;font-weight:700;font-size:13px;background:var(--soft)}
.pill.bad{background:var(--warn);color:#fff}
.pill.good{background:var(--good);color:#fff}
.streak{border-left:6px solid var(--accent)}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.bd{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;opacity:.45}
.bd span{width:52px;height:52px;border-radius:50%;border:3px solid var(--muted);display:flex;align-items:center;justify-content:center;font:800 20px var(--f-head)}
.bd small{font-size:12px;line-height:1.2}
.bd em{font-style:normal;font-size:12px;color:var(--muted)}
.bd.on{opacity:1}
.bd.on span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.bars div.part i{background:var(--muted);opacity:.45}
.note{padding:12px 0;border-top:1px solid var(--line)}
.note:first-of-type{border-top:0}
/* graphique de charge */
.cc{margin-top:12px}
.plot{position:relative;height:130px;border-bottom:1px solid var(--line)}
.cols{position:absolute;inset:0;display:flex;gap:6px;align-items:flex-end}
.cols button{flex:1;height:100%;padding:0;border:0;background:none;display:flex;align-items:flex-end;min-width:0}
.cols i{display:block;width:100%;background:#C5CAD3;border-radius:4px 4px 0 0;transition:background .1s}
.cols i.now{background:repeating-linear-gradient(45deg,#C5CAD3 0 5px,#DCE1E6 5px 10px)}
.cols button[aria-pressed="true"] i{background:var(--accent)}
.cols button:active i{background:var(--accent)}
.avg{position:absolute;left:0;right:0;border-top:2px dashed var(--ink);opacity:.45;pointer-events:none;z-index:1}
.lab{display:flex;gap:6px;margin-top:4px}
.lab span{flex:1;text-align:center;font-size:11px;color:var(--muted);white-space:nowrap}
.lab span.on{color:var(--ink);font-weight:700}
.avgk{display:inline-block;width:16px;border-top:2px dashed var(--ink);opacity:.5;vertical-align:middle;margin-right:4px}
.cr{min-height:62px}
/* connexion */
.login-wrap{min-height:100svh;display:flex;flex-direction:column}
.login-hero{background:#17212B;color:#fff;padding:calc(40px + env(safe-area-inset-top,0px)) 0 44px;border-radius:0 0 28px 28px;text-align:center;position:relative;overflow:hidden}
.login-hero::after{content:"";position:absolute;left:-10%;right:-10%;bottom:18px;height:3px;background:linear-gradient(90deg,transparent,var(--accent),transparent);opacity:.7}
.login-hero h1{font-size:44px;font-weight:800;letter-spacing:-.01em;margin-top:14px}
.login-hero p{margin:8px auto 0;max-width:280px;opacity:.8;font-size:17px}
.logo{display:block;margin:0 auto;border-radius:22%}
.login{padding-top:28px;padding-bottom:28px;display:flex;flex-direction:column;gap:18px;flex:1}
.login .demo{margin-top:auto;border:2px dashed var(--line);border-radius:14px;padding:14px}
.themes{display:flex;gap:8px;flex-wrap:wrap}
.hl{display:flex;align-items:center;gap:10px}
.hl .logo{flex:none;margin:0}
.top .lnk+.lnk{margin-left:2px}
/* états et détails */
.ac{position:relative}
.ac.done{background:color-mix(in srgb,var(--good) 8%,var(--surface));border-color:color-mix(in srgb,var(--good) 35%,var(--line));border-left-color:var(--good)}
.ac.done b{padding-right:34px}
.ac .cm{position:absolute;right:12px;top:12px;width:28px;height:28px;border-radius:50%;background:var(--good);color:#fff;display:flex;align-items:center;justify-content:center;font:800 16px var(--f-head)}
.pips{display:flex;gap:6px;margin:10px 0 8px}
.pips i{flex:1;height:14px;border-radius:7px;background:var(--soft)}
.pips i.on{background:var(--accent)}
.pips.all i.on{background:var(--good)}
details.how summary{list-style:none;min-height:48px;margin-top:10px;padding:0 14px;border-radius:12px;background:var(--soft);gap:10px;justify-content:flex-start}
details.how summary::-webkit-details-marker{display:none}
details.how summary .i{flex:none;width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--surface);display:flex;align-items:center;justify-content:center;font:800 14px var(--f-head)}
details.how summary::after{content:"›";margin-left:auto;font:800 24px/1 var(--f-head);transition:transform .15s}
details.how[open] summary::after{transform:rotate(90deg)}
details.how{border-top:0}
details.how[open]>div:first-of-type{margin-top:12px}
/* feuilles : barre d'action fixe */
.sbar{position:sticky;bottom:calc(-16px - env(safe-area-inset-bottom,0px));margin:4px -16px -16px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line);display:flex;gap:10px;z-index:2}
.sbar .btn:first-child{flex:1}
.sep{border:0;border-top:1px solid var(--line);margin:6px 0 2px;width:100%}
.li .btn.danger{border-color:transparent;min-height:36px;text-decoration:underline;text-underline-offset:3px}

 haltères","muscles":"Fessiers, ischio-jambiers, quadriceps, dos","cat":"Bas du corps","gif":"GIFS/dumbbell-deadlift.gif","start":"Pieds à largeur de hanches. Haltères au sol près des pieds. Fesses vers l’arrière. Dos plat. Bras tendus. Regard au sol.","exec":"Pousse dans le sol avec les pieds. Hanches et épaules montent ensemble. Redresse-toi complètement. Serre les fesses en haut. Redescends en poussant le bassin en arrière.","safety":"Dos plat du début à la fin. Charge légère. Haltères près des jambes. Bras tendus, sans tirer. Repose les haltères avec contrôle.","engage":"Fessiers, ischio-jambiers et quadriceps. Dos et abdominaux rigides. Avant-bras pour tenir la charge.","reps":"10","sets":"3","rest":"2 min","load":"Haltères légers"},{"id":"rowing-barre-allonge","name":"Rowing allongé à la barre coudée","muscles":"Dos, arrière des épaules","cat":"Haut du corps","gif":"GIFS/cambered-bar-lying-row.gif","start":"Allongé à plat ventre sur un banc surélevé. Poitrine au bord du banc. Bras tendus vers le sol, mains sur la barre. Regard vers le sol.","exec":"Tire les coudes vers le haut et l’arrière. Rapproche la barre du banc. Marque une courte pause. Redescends lentement, bras tendus.","safety":"Charge légère. Banc assez haut pour que la barre ne touche pas le sol. Tête dans le prolongement du dos. Pas d’à-coups.","engage":"Dos et arrière des épaules. Serre les omoplates en haut. Les bras guident, ils ne tirent pas seuls.","reps":"10","sets":"3","rest":"2 min","load":"Barre légère"},{"id":"rowing-arriere-epaule","name":"Rowing arrière d’épaule à l’haltère (un bras)","muscles":"Arrière des épaules, haut du dos","cat":"Haut du corps","gif":"GIFS/dumbbell-rear-delt-row.gif","start":"Une main en appui sur le banc. Buste penché, dos plat. Haltère dans l’autre main, bras tendu vers le sol. Regard au sol.","exec":"Tire le coude vers l’arrière, à hauteur du buste. Le coude s’écarte un peu du corps. Serre l’arrière de l’épaule. Redescends lentement.","safety":"Charge légère. Dos plat, sans rotation du buste. Cou relâché. Appui stable sur le banc.","engage":"Arrière des épaules et haut du dos. Abdominaux gainés. Évite de hausser les épaules vers les oreilles.","reps":"12","sets":"3","rest":"90 s","load":"Haltère léger"},{"id":"rameur","name":"Rameur (machine)","muscles":"Jambes, dos, bras","cat":"Cardio","gif":"GIFS/rowing-machine.gif","start":"Assis, pieds sanglés aux repose-pieds. Genoux fléchis, bras tendus vers la poignée. Dos droit, buste légèrement penché en avant.","exec":"Dans l’ordre : pousse avec les jambes, penche le buste en arrière, puis tire la poignée vers le ventre. Pour revenir : bras, buste, puis jambes. Mouvement fluide.","safety":"Dos droit, jamais arrondi. Serre bien les sangles. Commence à rythme lent. Respire en continu.","engage":"Jambes, dos et bras ensemble. Abdominaux gainés. La poussée vient surtout des jambes.","reps":"5 min","sets":"","rest":"","load":""},{"id":"rowing-machine-unilateral","name":"Rowing unilatéral à la machine","muscles":"Grand dorsal, haut du dos","cat":"Haut du corps","gif":"GIFS/lever-unilateral-row.gif","start":"Appui sur le coussin avec l’avant-bras ou le buste. Un pied au sol, l’autre jambe en appui léger. Bras tendu vers la poignée. Dos plat.","exec":"Tire le coude vers l’arrière, près du corps. Serre l’omoplate. Marque une courte pause. Reviens lentement, bras tendu.","safety":"Charge légère. Ne tourne pas le buste. Pas d’à-coups. Épaule relâchée.","engage":"Grand dorsal et muscles entre les omoplates. Le biceps aide. Tu sens le dos, pas le bras.","reps":"10","sets":"3","rest":"2 min","load":"Charge légère"},{"id":"rowing-halltere-support","name":"Rowing un bras à l’haltère (appui sur support)","muscles":"Grand dorsal, haut du dos","cat":"Haut du corps","gif":"GIFS/dumbbell-one-arm-row.gif","start":"Une main en appui sur le support. Buste penché, dos plat. Pieds écartés, un pied en arrière. Haltère dans l’autre main, bras tendu.","exec":"Tire le coude vers la hanche. L’haltère monte le long du corps. Serre l’omoplate en haut. Redescends lentement.","safety":"Dos plat. Charge modérée. Pas de rotation du buste. Haltère contrôlé à la descente.","engage":"Grand dorsal et haut du dos. Abdominaux gainés. Le biceps aide.","reps":"10","sets":"3","rest":"2 min","load":"Haltère modéré"},{"id":"developpe-couche-machine","name":"Développé couché à la machine (plaques)","muscles":"Pectoraux, deltoïdes, triceps","cat":"Haut du corps","gif":"GIFS/lever-chest-press.gif","start":"Assis, dos contre le dossier. Pieds à plat au sol. Mains sur les poignées, à hauteur de la poitrine. Épaules basses et en arrière.","exec":"Pousse les poignées devant toi. Étends les bras sans les bloquer. Reviens lentement jusqu’à la poitrine. Pas de rebond.","safety":"Règle le siège : poignées à hauteur de poitrine. Charge légère au début. Dos et tête contre le dossier. Ne verrouille pas les coudes en haut. Expire en poussant.","engage":"Pectoraux. Avant des épaules et triceps en soutien. Tu sens la poitrine travailler.","reps":"10","sets":"3","rest":"2 min","load":"Charge légère"},{"id":"pompes-pieds-sureleves","name":"Pompes pieds surélevés","muscles":"Pectoraux (haut), triceps, épaules","cat":"Haut du corps","gif":"GIFS/decline-push-up.gif","start":"Position de pompe. Pieds posés sur un banc. Mains un peu plus larges que les épaules. Corps aligné.","exec":"Plie les coudes pour descendre la poitrine vers le sol. Repousse pour remonter. Corps gainé.","safety":"Maîtrise d’abord les pompes classiques. Hanches ni affaissées, ni trop hautes. Tête dans l’alignement du dos.","engage":"Gaine ventre et fessiers. Pectoraux (partie haute), épaules et triceps poussent.","reps":"6","sets":"3","rest":"2 min","load":"/"},{"id":"pompes-horloge","name":"Pompes en horloge","muscles":"Pectoraux, triceps, épaules, abdominaux","cat":"Haut du corps","gif":"GIFS/clock-push-up.gif","start":"Position de pompe. Mains sous les épaules. Corps aligné tête-hanches-talons.","exec":"Fais une pompe. En haut, déplace les mains d’un cran, comme sur le cadran d’une horloge. Refais une pompe. Reviens au point de départ.","safety":"Maîtrise d’abord les pompes classiques. Garde le corps gainé quand tu déplaces les mains. Hanches stables.","engage":"Pectoraux, triceps et épaules poussent. Abdominaux et fessiers gainés pour garder le corps droit.","reps":"6","sets":"3","rest":"2 min","load":"/"},{"id":"fente-statique-smith","name":"Fente statique à la Smith machine","muscles":"Quadriceps, fessiers, ischio-jambiers","cat":"Bas du corps","gif":"GIFS/smith-split-squat.gif","start":"Barre sur le haut des trapèzes. Une jambe devant, l’autre derrière, pieds bien écartés. Buste droit.","exec":"Plie les deux genoux. Descends droit, sans avancer. Le genou arrière frôle le sol. Remonte en poussant sur la jambe avant.","safety":"Règle bien les crochets d’arrêt. Commence avec la barre seule. Genou avant dans l’axe du pied. Pas de rebond en bas.","engage":"Quadriceps et fessier de la jambe avant. Abdominaux gainés pour garder le buste droit.","reps":"8 par jambe","sets":"3","rest":"2 min","load":"Barre seule"},{"id":"swing-kettlebell","name":"Swing au kettlebell","muscles":"Fessiers, ischio-jambiers, dos, épaules","cat":"Bas du corps","gif":"GIFS/kettlebell-swing.gif","start":"Pieds un peu plus larges que les épaules. Kettlebell au sol devant toi. Hanches en arrière, dos plat. Mains sur la poignée.","exec":"Balance le kettlebell entre les jambes. Pousse fort les hanches vers l’avant. Le kettlebell monte à hauteur de poitrine. Laisse-le redescendre, hanches en arrière.","safety":"Dos plat, jamais arrondi. Le mouvement vient des hanches, pas des bras. Charge légère au début. Espace dégagé devant toi.","engage":"Fessiers et ischio-jambiers propulsent. Abdominaux gainés. Les bras restent relâchés et guident seulement.","reps":"12","sets":"3","rest":"2 min","load":"Kettlebell léger"},{"id":"planche-genou-coude-mains","name":"Planche, genou vers le coude (sur les mains)","muscles":"Abdominaux, obliques, épaules","cat":"Abdos et gainage","gif":"GIFS/knee-to-elbow-plank.gif","start":"Position de planche sur les mains. Mains sous les épaules. Corps aligné.","exec":"Amène un genou vers le coude du même côté. Reviens. Change de côté. Garde les hanches basses.","safety":"Dos plat. Pas de rotation excessive du bassin.","engage":"Gaine le ventre. Les obliques tirent le genou vers le coude.","reps":"10 par côté","sets":"3","rest":"90 s","load":"/"},{"id":"banc-genou-releve","name":"Relevé de genou sur banc","muscles":"Fléchisseurs de hanche, abdominaux","cat":"Abdos et gainage","gif":"GIFS/bench-knee-raise.gif","start":"Dos appuyé sur le banc. Mains de chaque côté. Genoux pliés, pieds au-dessus du sol.","exec":"Ramène un genou vers la poitrine. Redescends lentement. Change de jambe.","safety":"Reste bien appuyé sur le banc. Pas d’élan.","engage":"Contracte le ventre. Garde le mouvement lent.","reps":"10 par côté","sets":"3","rest":"2 min","load":"/"},{"id":"donkey-kick-elastique","name":"Extension de hanche à quatre pattes avec élastique","muscles":"Fessiers","cat":"Bas du corps","gif":"GIFS/banded-donkey-kick.gif","start":"À quatre pattes. Mains sous les épaules, genoux sous les hanches. Élastique au-dessus des genoux.","exec":"Lève une jambe vers l’arrière et le haut. Pousse le talon vers le plafond. Reviens sans poser le genou.","safety":"Dos plat, sans creuser. Bassin face au sol.","engage":"Serre le fessier en haut. Contrôle le retour.","reps":"12 par jambe","sets":"3","rest":"2 min","load":"Élastique"},{"id":"kickback-poulie-debout","name":"Extension de hanche à la poulie (debout)","muscles":"Fessiers, ischio-jambiers","cat":"Bas du corps","gif":"GIFS/cable-standing-kickback.gif","start":"Face à la poulie. Sangle à la cheville. Mains sur la barre, buste droit.","exec":"Envoie la jambe tendue vers l’arrière. Reviens lentement.","safety":"Ne cambre pas le dos. Petite amplitude, charge légère.","engage":"Serre le fessier. Garde le buste immobile.","reps":"12 par jambe","sets":"3","rest":"2 min","load":"Charge légère"},{"id":"presse-cuisses-inclinee","name":"Presse à cuisses inclinée","muscles":"Quadriceps, fessiers","cat":"Bas du corps","gif":"GIFS/leg-press-45.gif","start":"Assis, dos bien plaqué. Pieds à largeur d’épaules sur la plateforme.","exec":"Plie les genoux vers la poitrine. Pousse avec tout le pied. Tends les jambes sans bloquer les genoux.","safety":"Garde le bassin collé au siège. Genoux dans l’axe des pieds. Charge légère.","engage":"Pousse dans les talons. Contrôle la descente.","reps":"10","sets":"3","rest":"2 min","load":"Charge légère"},{"id":"reverse-plank-jambe","name":"Planche inversée, jambe levée","muscles":"Fessiers, ischio-jambiers, dos","cat":"Bas du corps","gif":"GIFS/reverse-plank-leg-raise.gif","start":"Assis, mains derrière toi, doigts vers les pieds. Soulève le bassin. Corps en ligne.","exec":"Lève une jambe tendue. Repose-la. Change de jambe.","safety":"Ne laisse pas le bassin tomber. Épaules loin des oreilles.","engage":"Serre fessiers et abdos. Garde le corps aligné.","reps":"8 par jambe","sets":"3","rest":"2 min","load":"/"},{"id":"squat-halteres","name":"Squat aux haltères","muscles":"Quadriceps, fessiers","cat":"Bas du corps","gif":"GIFS/dumbbell-squat.gif","start":"Pieds à largeur d’épaules. Un haltère dans chaque main, bras tendus.","exec":"Plie les genoux, bassin en arrière. Descends jusqu’aux cuisses parallèles. Remonte en poussant dans les talons.","safety":"Dos droit. Genoux dans l’axe des pieds.","engage":"Poitrine haute. Serre les fessiers en remontant.","reps":"10","sets":"3","rest":"2 min","load":"Haltères légers"},{"id":"squat-bulgare-halteres","name":"Squat bulgare aux haltères","muscles":"Quadriceps, fessiers","cat":"Bas du corps","gif":"GIFS/dumbbell-bulgarian-split-squat.gif","start":"Dos au banc. Un pied posé derrière sur le banc. Un haltère dans chaque main.","exec":"Plie le genou avant. Descends en gardant le buste droit. Remonte en poussant dans le pied avant.","safety":"Pied avant assez loin du banc. Genou au-dessus du pied. Commence sans charge.","engage":"Pousse dans le talon avant. Reste stable.","reps":"8 par jambe","sets":"3","rest":"2 min","load":"Sans charge au début"},{"id":"planche-laterale-jambe","name":"Planche latérale, jambe levée","muscles":"Obliques, fessiers","cat":"Abdos et gainage","gif":"GIFS/side-plank-leg-raise.gif","start":"Sur le côté, appui sur la main. Corps aligné. Main libre sur la hanche.","exec":"Lève la jambe du dessus. Redescends sans poser. Change de côté.","safety":"Hanches hautes. Épaule au-dessus de la main.","engage":"Serre le ventre. Garde le corps en ligne.","reps":"8 par côté","sets":"3","rest":"2 min","load":"/"},{"id":"rotation-landmine","name":"Rotation à la barre (landmine)","muscles":"Obliques, épaules","cat":"Abdos et gainage","gif":"GIFS/landmine-rotation.gif","start":"Debout, pieds écartés. Les deux mains au bout de la barre.","exec":"Dessine un arc de gauche à droite. Pivote sur les pieds. Contrôle le retour.","safety":"Charge légère. Dos droit. Genoux souples.","engage":"Contracte les obliques. Les bras suivent le buste.","reps":"10 par côté","sets":"3","rest":"2 min","load":"Charge légère"},{"id":"inclinaison-laterale-kb","name":"Inclinaison latérale au kettlebell","muscles":"Obliques","cat":"Abdos et gainage","gif":"GIFS/kettlebell-side-bend.gif","start":"Debout, pieds à largeur de hanches. Kettlebell levé d’un côté.","exec":"Incline le buste sur le côté opposé. Reviens au centre.","safety":"Reste de face, sans tourner. Charge légère.","engage":"Contracte le ventre du côté qui s’allonge.","reps":"10 par côté","sets":"3","rest":"2 min","load":"Kettlebell léger"},{"id":"pallof-press","name":"Pallof press","muscles":"Abdominaux, obliques","cat":"Abdos et gainage","gif":"GIFS/pallof-press.gif","start":"Debout de profil à la poulie. Poignée à deux mains devant la poitrine.","exec":"Pousse les bras devant toi. Ramène vers la poitrine. Le buste ne tourne pas.","safety":"Pieds stables. Charge légère. Dos droit.","engage":"Serre le ventre. Résiste à la traction.","reps":"10 par côté","sets":"3","rest":"2 min","load":"Charge légère"},{"id":"releve-genoux-allonge","name":"Relevé de genoux allongé","muscles":"Abdominaux, fléchisseurs de hanche","cat":"Abdos et gainage","gif":"GIFS/lying-knee-raise.gif","start":"Allongé sur le dos. Jambes tendues, bras le long du corps.","exec":"Plie les genoux vers la poitrine. Redescends les jambes sans les poser.","safety":"Bas du dos collé au sol. Nuque détendue.","engage":"Contracte le ventre en montant. Va lentement.","reps":"12","sets":"3","rest":"2 min","load":"/"},{"id":"crunch-velo-elastique","name":"Crunch vélo avec élastique","muscles":"Abdominaux, obliques","cat":"Abdos et gainage","gif":"GIFS/band-bicycle-crunch.gif","start":"Allongé sur le dos. Élastique autour des pieds. Mains derrière la tête.","exec":"Amène un genou vers le coude opposé. Change de côté. Garde l’élastique tendu.","safety":"Ne tire pas sur la nuque. Bas du dos au sol.","engage":"Tourne avec le buste, pas avec les bras.","reps":"20","sets":"3","rest":"2 min","load":"Élastique"},{"id":"montee-bassin-appui-arriere","name":"Montée de bassin en appui arrière","muscles":"Triceps, fessiers, ischio-jambiers","cat":"Abdos et gainage","gif":"GIFS/reverse-plank-hip-raise.gif","start":"Assis, mains derrière toi, doigts vers les pieds. Jambes tendues.","exec":"Pousse les hanches vers le haut. Corps aligné. Redescends doucement.","safety":"Épaules loin des oreilles. Poignets confortables.","engage":"Serre les fessiers. Pousse dans les mains et les talons.","reps":"10","sets":"3","rest":"2 min","load":"/"},{"id":"dead-bug","name":"Dead bug","muscles":"Abdominaux","cat":"Abdos et gainage","gif":"GIFS/dead-bug.gif","start":"Sur le dos. Bras tendus vers le plafond. Genoux pliés à 90°.","exec":"Étends un bras et la jambe opposée. Reviens. Change de côté.","safety":"Bas du dos collé au sol. Va lentement.","engage":"Contracte le ventre tout le long.","reps":"8 par côté","sets":"3","rest":"2 min","load":"/"},{"id":"position-v","name":"Position en V (bateau)","muscles":"Abdominaux, fléchisseurs de hanche","cat":"Abdos et gainage","gif":"GIFS/v-sit.gif","start":"Assis, genoux pliés. Penche-toi un peu en arrière. Bras devant.","exec":"Tends les jambes vers le haut. Reviens genoux pliés.","safety":"Dos long, pas arrondi. Si c’est dur, garde les genoux pliés.","engage":"Serre le ventre. Respire normalement.","reps":"8","sets":"3","rest":"2 min","load":"/"},{"id":"burpee","name":"Burpee","muscles":"Corps entier","cat":"Cardio","gif":"GIFS/burpee.gif","start":"Debout, pieds à largeur d’épaules.","exec":"Accroupis-toi, mains au sol. Envoie les pieds en arrière. Reviens et relève-toi.","safety":"Dos plat en planche. Va à ton rythme.","engage":"Garde le ventre serré. Enchaîne sans te précipiter.","reps":"8","sets":"3","rest":"2 min","load":"/"},{"id":"jumping-jacks","name":"Jumping jacks","muscles":"Corps entier, cardio","cat":"Cardio","gif":"GIFS/jumping-jacks.gif","start":"Debout, pieds joints. Bras le long du corps.","exec":"Saute en écartant les pieds. Lève les bras au-dessus de la tête. Reviens.","safety":"Atterris sur la pointe des pieds. Genoux souples.","engage":"Garde un rythme régulier. Respire.","reps":"30","sets":"3","rest":"2 min","load":"/"},{"id":"developpe-epaules-smith","name":"Développé épaules à la Smith (assis)","muscles":"Épaules, triceps","cat":"Haut du corps","gif":"GIFS/smith-shoulder-press.gif","start":"Assis, dos bien appuyé. Barre au niveau du menton.","exec":"Pousse la barre vers le haut. Redescends en contrôlant.","safety":"Ne cambre pas le dos. Charge légère. Débloque la barre avant de commencer.","engage":"Pousse avec les épaules. Garde les poignets droits.","reps":"10","sets":"3","rest":"2 min","load":"Charge légère"},{"id":"developpe-epaules-halteres","name":"Développé épaules aux haltères (assis)","muscles":"Épaules, triceps","cat":"Haut du corps","gif":"GIFS/dumbbell-shoulder-press.gif","start":"Assi /* ===== stockage : Firebase (ou un faux stockage pour les tests) ===== */
const ALPHA='ABCDEFGHJKMNPQRSTUVWXYZ23456789';
const rnd=n=>{const a=new Uint32Array(n);crypto.getRandomValues(a);return [...a].map(x=>ALPHA[x%ALPHA.length]).join('')};
const uid=p=>p+Date.now().toString(36)+rnd(4).toLowerCase();
const newCode=name=>String(name).normalize('NFD').replace(/[^A-Za-z]/g,'').slice(0,3).toUpperCase().padEnd(3,'X')+'-'+rnd(4)+'-'+rnd(4);
const Store=window.__STORE__||(()=>{
  let M=null;
  const load=async()=>{
    if(M)return M;
    const B='https://www.gstatic.com/firebasejs/10.14.1/';
    const [A,Au,F]=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-auth.js'),import(B+'firebase-firestore.js')]);
    const app=A.initializeApp(FIREBASE_CONFIG),auth=Au.getAuth(app);
    let db;try{db=F.initializeFirestore(app,{localCache:F.persistentLocalCache({tabManager:F.persistentMultipleTabManager()})})}catch(e){db=F.getFirestore(app)}
    M={Au,F,auth,db};return M;
  };
  const user=async()=>{const m=await load();await m.auth.authStateReady();return m.auth.currentUser};
  const ref=(m,c,i)=>m.F.doc(m.db,c,i);
  const list=async(m,c,q)=>(await m.F.getDocs(q||m.F.collection(m.db,c))).docs.map(d=>({...d.data(),id:d.id}));
  return{
    async resume(){
      const u=await user();if(!u)return null;const m=M;
      const s=await m.F.getDoc(ref(m,'members',u.uid));if(!s.exists())return null;
      const mem=s.data(),c=await m.F.getDoc(ref(m,'codes',mem.code));
      return {...mem,name:c.exists()?(c.data().name||''):''};
    },
    async login(code){
      const m=await load();let u=await user();
      if(!u){await m.Au.signInAnonymously(m.auth);u=m.auth.currentUser}
      const c=await m.F.getDoc(ref(m,'codes',code));if(!c.exists())return null;
      const d=c.data(),mem={code,role:d.role};if(d.role==='athlete')mem.athleteId=d.athleteId;
      await m.F.deleteDoc(ref(m,'members',u.uid)).catch(()=>{});
      await m.F.setDoc(ref(m,'members',u.uid),mem);
      return {...mem,name:d.name||''};
    },
    async logout(){const m=await load(),u=m.auth.currentUser;if(u)await m.F.deleteDoc(ref(m,'members',u.uid)).catch(()=>{});await m.Au.signOut(m.auth)},
    async loadAll(role,athId){
      const m=await load(),F=m.F,out={types:await list(m,'types'),sessions:await list(m,'sessions'),exercises:await list(m,'exercises')};
      if(role==='coach'){out.ath=await list(m,'athletes');out.acts=await list(m,'acts')}
      else out.acts=await list(m,'acts',F.query(F.collection(m.db,'acts'),F.where('ath','==',athId)));
      return out;
    },
    write(ops){
      const m=M,F=m.F;
      for(let i=0;i<ops.length;i+=400){
        const b=F.writeBatch(m.db);
        ops.slice(i,i+400).forEach(o=>{const r=ref(m,o.col,o.id);if(o.op==='del')b.delete(r);else b.set(r,o.data)});
        b.commit().catch(e=>{console.error(e);toast('Enregistrement refusé ou impossible.')});
      }
    },
    async codeSet(code,data){const m=await load();return m.F.setDoc(ref(m,'codes',code),data)},
    async codeDel(code){const m=await load();return m.F.deleteDoc(ref(m,'codes',code))},
    async dropMembers(athId){
      const m=await load(),F=m.F,l=await list(m,'members',F.query(F.collection(m.db,'members'),F.where('athleteId','==',athId)));
      await Promise.all(l.map(x=>F.deleteDoc(ref(m,'members',x.id)).catch(()=>{})));
    }
  };
})();

let DB={ath:[],types:[],acts:[],sessions:[],exercises:[]};
const COLS={ath:'athletes',types:'types',acts:'acts',sessions:'sessions',exercises:'exercises'};
let LAST={};
const snap=()=>{LAST={};Object.keys(COLS).forEach(c=>{LAST[c]=new Map(DB[c].map(x=>[x.id,JSON.stringify(x)]))})};
const clean=o=>JSON.parse(JSON.stringify(o));
function save(){
  const ops=[],cols=S.role==='coach'?Object.keys(COLS):['acts'];
  cols.forEach(c=>{
    const cur=new Map();
    DB[c].forEach(x=>{const j=JSON.stringify(x);cur.set(x.id,j);if(LAST[c].get(x.id)!==j)ops.push({op:'set',col:COLS[c],id:x.id,data:clean(x)})});
    LAST[c].forEach((j,id)=>{if(!cur.has(id))ops.push({op:'del',col:COLS[c],id})});
    LAST[c]=cur;
  });
  if(ops.length)try{Store.write(ops)}catch(e){console.error(e);toast('Enregistrement impossible.')}
}

const MILES=[1,5,10,25,50];
function weekDone(id,m){const t=wkStats(id,m);return t.planned>0&&t.done===t.planned}
function streak(id){const cur=mondayOf(TODAY);let m=weekDone(id,cur)?cur:addDays(cur,-7),n=0;while(weekDone(id,m)){n++;m=addDays(m,-7)}return n}
function weekMsg(done,planned,cur){
  if(!planned)return 'Pas de séance prévue. Profite de la récupération.';
  if(done===planned)return 'Semaine complète. Bravo, tout est fait !';
  if(!cur)return done?'Tu as fait '+done+' séance'+(done>1?'s':'')+' sur '+planned+'. Bien joué.':'Semaine de pause. On repart de plus belle.';
  if(done===0)return 'C’est parti. Une séance à la fois.';
  return 'Bien joué, encore '+(planned-done)+' à faire pour finir la semaine.';
}
function longestStreak(id){
  const l=actsOf(id);if(!l.length)return 0;
  const cur=mondayOf(TODAY);let m=mondayOf(l.map(a=>a.date).sort()[0]),best=0,run=0;
  while(m<=cur){if(weekDone(id,m)){run++;best=Math.max(best,run)}else run=0;m=addDays(m,7)}
  return best;
}
function achList(id){
  const d=actsOf(id).filter(a=>a.done),tot=d.length,mins=d.reduce((t,a)=>t+(a.min||0),0),cur=mondayOf(TODAY);
  let wc=0;new Set(actsOf(id).map(a=>mondayOf(a.date))).forEach(m=>{if(m<=cur&&weekDone(id,m))wc++});
  const by={};d.forEach(a=>{by[a.type]=(by[a.type]||0)+1});
  const kinds=Object.keys(by).length,com=d.filter(a=>a.comment).length,best=longestStreak(id);

  let up=false;const bs={};d.filter(a=>a.sessionId&&a.weights).sort((x,y)=>x.date.localeCompare(y.date)).forEach(a=>{(bs[a.sessionId]=bs[a.sessionId]||[]).push(a.weights)});
  Object.values(bs).forEach(arr=>{if(arr.length>1){const f=arr[0],l=arr[arr.length-1];Object.keys(l).forEach(k=>{if(f[k]!=null&&l[k]>f[k])up=true})}});
  const L=[],tier=(g,k,arr,c,lab)=>arr.forEach(x=>L.push({g,k:k+x,n:x,l:lab(x),cur:Math.min(c,x),goal:x,ok:c>=x}));

  tier('Régularité','w',[1,3,5,10],wc,x=>x+(x>1?' semaines complètes':' semaine complète'));
  tier('Régularité','st',[2,4,8],best,x=>x+' semaines de suite');
  DB.types.forEach(t=>tier('Polyvalence','t'+t.id+'_',[5,15],by[t.id]||0,x=>t.name+' ×'+x));
  L.push({g:'Polyvalence',k:'poly',n:3,l:'3 types d’activité',cur:Math.min(kinds,3),goal:3,ok:kinds>=3});
  L.push({g:'Progression',k:'up',n:'+',l:'Charges en hausse',cur:up?1:0,goal:1,ok:up});
  L.push({g:'Progression',k:'back',n:'↑',l:'Retour en force',cur:back?1:0,goal:1,ok:back});
  tier('Progression','c',[5,15],com,x=>x+' ressentis commentés');

}

function editSheet(id){

  const fut=DB.acts.filter(x=>x.ath===a.ath&&(x.baseTitle||x.title)===(a.baseTitle||a.title)&&x.type===a.type&&x.sessionId===a.sessionId&&!!x.options===!!a.options&&!x.done&&x.date>a.date).length;
  S.sheet={kind:'edit',id,date:a.date};
  let h='<h2>Modifier la séance</h2><p class="muted" style="margin:0">'+esc(athOf(a.ath).name)+'</p>'
  +'<label class="f">Date<input id="e-date" type="date" value="'+a.date+'"></label>'
  +'<label class="f">Type<select id="e-type">'+DB.types.map(t=>'<option value="'+t.id+'"'+(t.id===a.type?' selected':'')+'>'+esc(t.name)+'</option>').join('')+'</select></label>'
  +'<div id="e-mwrap">'+modeHtml('e',a)+'</div>'
  +'<label class="f">Titre<input id="e-title" maxlength="60" value="'+esc(a.baseTitle||a.title)+'"></label>'
  +'<label class="f">Consignes<textarea id="e-det">'+esc(a.detail||'')+'</textarea></label>'
  +(fut?'<div class="pick"><label><input type="checkbox" id="e-fut">Appliquer aussi aux '+fut+' semaine'+(fut>1?'s':'')+' suivante'+(fut>1?'s':'')+' identique'+(fut>1?'s':'')+'</label></div><p class="muted small" style="margin:0">Le titre, le type et les consignes changent. Les dates restent les mêmes.</p>':'')
  +'<div id="e-err" role="alert" style="color:var(--warn)"></div><div class="sbar"><button class="btn amber" data-act="edit-save">Enregistrer</button><button class="btn ghost" data-act="edit-cancel">Annuler</button></div>';
  showSheet(h);syncMode('e');
}
function saveEdit(){
  const a=DB.acts.find(x=>x.id===S.sheet.id),err=$('#e-err'),date=$('#e-date').value;
  if(!date){err.textContent='Choisis une date.';return}
  const ty=$('#e-type').value,m=ty==='muscu',chk=document.querySelector('input[name="e-mode"]:checked'),ch=m&&!!chk&&chk.value==='choice',opts=ch?[...document.querySelectorAll('.eo:checked')].map(x=>x.value):null;
  if(ch&&opts.length<2){err.textContent='Choisis au moins deux séances à proposer.';return}
  const sid=m&&!ch?$('#e-sess').value:null;
  let title=$('#e-title').value.trim();if(!title&&m)title=ch?'Musculation au choix':sessOf(sid).title;
  if(!title){err.textContent='Donne un titre à l’activité.';return}
  const det=$('#e-det').value.trim(),fut=$('#e-fut')&&$('#e-fut').checked,o={ath:a.ath,title:a.baseTitle||a.title,type:a.type,sessionId:a.sessionId,date:a.date,ch:!!a.options};
  const apply=x=>{x.type=ty;x.detail=det;if(ch){x.options=opts.slice();x.baseTitle=title;x.sessionId=opts.includes(x.sessionId)?x.sessionId:null;x.title=x.sessionId?sessOf(x.sessionId).title:title}else{delete x.options;delete x.baseTitle;x.sessionId=sid;x.title=title}};
  if(fut)DB.acts.forEach(x=>{if(x!==a&&x.ath===o.ath&&(x.baseTitle||x.title)===o.title&&x.type===o.type&&x.sessionId===o.sessionId&&!!x.options===o.ch&&!x.done&&x.date>o.date)apply(x)});
  a.date=date;apply(a);
  save();S.sheet=null;$('#sheet').innerHTML='';render();toast(fut?'Séances modifiées.':'Séance modifiée.');
}
/* ===== coach : suivi ===== */
const NF=n=>Math.round(n).toLocaleString('fr-FR');
function lateHtml(id){const n=actsOf(id,addDays(TODAY,-14),addDays(TODAY,-1)).filter(a=>!a.done).length;return n?'<p style="margin:8px 0 0"><span class="pill">'+n+' séance'+(n>1?'s':'')+' non faite'+(n>1?'s':'')+' sur 14 jours</span></p>':''}
function weekLoad(list,m){const e=addDays(m,6);let t=0;list.forEach(a=>actsOf(a.id).forEach(x=>{if(x.done){const d=eff(x);if(d>=m&&d<=e)t+=load(x)}}));return t/Math.max(list.length,1)}
function weekCount(list,m){const e=addDays(m,6);let n=0,r=0;list.forEach(a=>actsOf(a.id).forEach(x=>{if(x.done){const d=eff(x);if(d>=m&&d<=e){n++;r+=x.rpe}}}));return{n,rpe:n?r/n:0}}
function chargeCard(list){
  const W=8,cur=mondayOf(TODAY),ms=[];for(let i=W-1;i>=0;i--)ms.push(addDays(cur,-7*i));
  const v=ms.map(m=>weekLoad(list,m)),mx=Math.max(...v,1);
  if(S.cw==null||S.cw>=W)S.cw=W-2;
  const k=S.cw,prev=v.slice(Math.max(0,k-4),k),avg=prev.length?prev.reduce((a,b)=>a+b,0)/prev.length:0,pct=avg>0?Math.round(100*(v[k]-avg)/avg):null,c=weekCount(list,ms[k]);
  const who=S.sa==='all'?'Moyenne par athlète':esc(athOf(S.sa).name);
  let h='<div class="card"><div class="row" style="justify-content:space-between"><h2 class="h2">Évolution de la charge</h2></div><p class="muted small" style="margin:2px 0 8px">'+who+' · 8 semaines · RPE × minutes</p>';
  h+='<div aria-live="polite" class="cr"><b class="big">'+NF(v[k])+'</b><span class="muted small"> Semaine du '+esc(fmtShort(ms[k]))+(k===W-1?' (en cours)':'')+'</span><p class="small" style="margin:4px 0 0">'+c.n+' séance'+(c.n>1?'s':'')+(c.n?' · RPE moyen '+c.rpe.toFixed(1).replace('.',','):'')+(pct!=null&&!(k===W-1&&pct<0)?' · <b>'+(pct>0?'+':'')+pct+' %</b> vs moyenne des '+prev.length+' semaines avant'+(pct>30?' <span class="pill bad">Hausse rapide</span>':''):'')+'</p></div>';
  h+='<div class="cc"><div class="plot">'+(avg>0?'<div class="avg" style="bottom:'+Math.round(100*avg/mx)+'%"></div>':'')+'<div class="cols">'+ms.map((m,i)=>'<button data-act="cw" data-id="'+i+'" aria-pressed="'+(i===k)+'" aria-label="Semaine du '+esc(fmtShort(m))+' : charge '+NF(v[i])+'"><i class="'+(i===W-1?'now':'')+'" style="height:'+Math.max(2,Math.round(100*v[i]/mx))+'%"></i></button>').join('')+'</div></div><div class="lab">'+ms.map((m,i)=>'<span'+(i===k?' class="on"':'')+'>'+parse(m).getDate()+'/'+(parse(m).getMonth()+1)+'</span>').join('')+'</div></div>';
  h+='<p class="muted small" style="margin:10px 0 0"><span class="avgk"></span> Moyenne des semaines précédentes. Touche une barre pour voir la semaine.</p></div>';
  return h;
}
function suiviView(){
  const mon=mondayOf(TODAY),list=S.sa==='all'?DB.ath:DB.ath.filter(a=>a.id===S.sa);
  let h='<div class="chips"><button class="chip" data-act="sf" data-id="all" aria-pressed="'+(S.sa==='all')+'">Tous</button>'+DB.ath.map(a=>'<button class="chip" data-act="sf" data-id="'+a.id+'" aria-pressed="'+(S.sa===a.id)+'">'+esc(a.name)+'</button>').join('')+'</div>';
  h+=chargeCard(list);
  h+='<p class="eyebrow">Cette semaine · '+fmtRange(mon)+'</p>';
  list.forEach(a=>{const st=wkStats(a.id,mon),pct=st.planned?Math.round(100*st.done/st.planned):0;
    h+='<div class="card"><div class="row" style="justify-content:space-between"><h2 class="h2">'+esc(a.name)+'</h2><button class="btn ghost sm" data-act="fiche" data-id="'+a.id+'">Fiche</button></div><p class="muted small" style="margin:4px 0 8px">'+st.done+' faite'+(st.done>1?'s':'')+' sur '+st.planned+' prévue'+(st.planned>1?'s':'')+'</p><div class="prog"><i style="width:'+pct+'%"></i></div><p class="muted small" style="margin:8px 0 0">Charge de la semaine : '+st.charge+'</p>'+injPill(a)+lateHtml(a.id)+countsHtml(a.id)+'</div>'});
  h+='<p class="eyebrow" style="margin-top:6px">Derniers ressentis</p>';
  const f=DB.acts.filter(a=>a.done&&(S.sa==='all'||a.ath===S.sa)).sort((a,b)=>eff(b).localeCompare(eff(a))||b.id.localeCompare(a.id)).slice(0,10);
  h+='<div class="card">'+(f.length?f.map(a=>{const t=typeOf(a.type);return '<button '+tAttr(t).replace('class="t"','class="t logi"')+' data-act="day" data-id="'+a.date+'"><div class="row" style="justify-content:space-between"><b>'+esc(athOf(a.ath).name)+' · '+esc(a.title)+'</b><span class="rpe'+(a.rpe>=9?' hi':'')+'">RPE '+a.rpe+'</span></div><span class="muted small">'+esc(fmtShort(eff(a)))+' · '+a.min+' min · charge '+load(a)+'</span>'+(a.comment?'<q>« '+esc(a.comment)+' »</q>':'')+'</button>'}).join(''):'<p class="muted" style="margin:0">Aucune séance faite.</p>')+'</div>';
  return h;

  let h=edHeader(S.ed.isNew?'Nouvel exercice':'Modifier l’exercice',d.name||'Sans nom');
  h+='<div class="card"><img id="gprev" class="gprev" src="'+esc(d.gif||'')+'" alt=""'+(d.gif?'':' hidden')+'><label class="f">Fichier du GIF<input data-bind="gif" value="'+esc(d.gif||'')+'" placeholder="GIFS/mon-exercice.gif" autocapitalize="none" spellcheck="false"></label><p class="muted small" style="margin:6px 0 0">Ajoute d’abord le GIF dans le dossier gifs de GitHub, puis écris ici son chemin.</p></div>';
  h+='<label class="f">Nom<input data-bind="name" maxlength="80" value="'+esc(d.name)+'"></label><label class="f">Muscles<input data-bind="muscles" maxlength="80" value="'+esc(d.muscles)+'"></label><label class="f">Catégorie<select data-bind="cat">'+CATS.map(c=>'<option'+(c===d.cat?' selected':'')+'>'+esc(c)+'</option>').join('')+'</select></label>';
  h+='<p class="eyebrow" style="margin:6px 0 0">Consignes</p><p class="muted small" style="margin:0">Phrases courtes, pour des débutants.</p>';
  [['start','Position de départ'],['exec','Exécution'],['safety','Sécurité'],['engage','Engagement']].forEach(f=>{h+='<label class="f">'+f[1]+'<textarea data-bind="'+f[0]+'">'+esc(d[f[0]]||'')+'</textarea></label>'});
  h+='<p class="eyebrow" style="margin:6px 0 0">Valeurs proposées dans une séance</p><div class="g2"><label class="f">Séries<input data-bind="sets" value="'+esc(d.sets)+'"></label><label class="f">Répétitions<input data-bind="reps" value="'+esc(d.reps)+'"></label><label class="f">Repos<input data-bind="rest" value="'+esc(d.rest)+'"></label><label class="f">Charge<input data-bind="load" value="'+esc(d.load)+'"></label></div>';
  if(!S.ed.isNew){const n=DB.sessions.filter(x=>x.items.some(i=>i.exId===d.id)).length;h+=(n?'<p class="muted small">Utilisé dans '+n+' séance'+(n>1?'s':'')+'. Retire-le de ces séances avant de le supprimer.</p>':'<button class="btn danger block" data-act="askedel">Supprimer cet exercice</button>')}
  h+='<div id="ed-err" role="alert" style="color:var(--warn)"></div></main><div class="fixed act-bar"><div class="in row" style="flex-wrap:nowrap"><button class="btn amber grow" data-act="esave">Enregistrer</button><button class="btn ghost" data-act="edcancel">Annuler</button></div></div>';
  return h;
}
const slug=t=>String(t).normalize('NFD').replace(/[^A-Za-z0-9]+/g,'-').replace(/^-|-$/g,'').toLowerCase().slice(0,30)||'x';

/* ===== rendu ===== */
function render(){
  const app=$('#app');buildExo();
  if(S.busy){app.innerHTML='<div class="in load"><p class="muted">Chargement…</p></div>';return}
  if(!S.role){app.innerHTML=loginView();return}
  if(S.role==='coach'&&S.ed){app.innerHTML=S.ed.kind==='sess'?sessEdit():exoEdit();return}
  if(S.role==='athlete'&&S.open){app.innerHTML=detailView();updProg();return}
  if(S.role==='coach'&&S.fiche){app.innerHTML='<header class="top"><div class="in"><button class="back" data-act="fback" aria-label="Retour">‹</button><h1>Fiche athlète<small>'+esc(athOf(S.fiche).name)+'</small></h1></div></header><main class="in main">'+ficheView()+'</main>';return}
  let main,tabs;
  if(S.role==='athlete'){main=S.tab==='hist'?histView():weekView();tabs=[['week','Semaine'],['hist','Historique']];if(S.tab!=='hist')S.tab='week'}
  else{main=S.tab==='suivi'?suiviView():S.tab==='ath'?athView():S.tab==='lib'?libTab():calView();tabs=[['cal','Calendrier'],['suivi','Suivi'],['ath','Athlètes'],['lib','Séances']];if(!['suivi','ath','lib'].includes(S.tab))S.tab='cal'}
  app.innerHTML=header()+'<main class="in main">'+main+'</main>'+tabbar(tabs);
}
let ATHNAME='';
async function reload(){
  const r=await Store.loadAll(S.role,S.me);
  DB.types=r.types;DB.sessions=r.sessions;DB.exercises=r.exercises;DB.acts=r.acts;
  DB.ath=S.role==='coach'?r.ath:[{id:S.me,name:ATHNAME}];
  snap();
}
async function enter(m){
  S.role=m.role;S.me=m.athleteId||null;ATHNAME=m.name||'';S.tab=m.role==='coach'?'cal':'week';S.wk=0;S.open=null;S.fiche=null;S.ed=null;S.sheet=null;S.draft={};
  S.busy=true;render();
  try{
    await reload();
    if(S.role==='coach'){
      if(!DB.types.length)DB.types=clean(SEED_TYPES);
      if(!DB.exercises.length&&!DB.sessions.length){DB.exercises=clean(SEED.exercises);DB.sessions=clean(SEED.sessions)}
      save();
    }
  }catch(e){console.error(e);S.busy=false;S.role=null;render();$('#lerr')&&($('#lerr').textContent='Chargement impossible. Vérifie ta connexion puis réessaie.');return}
  S.busy=false;render();window.scrollTo(0,0);
}
async function login(code){
  const c=String(code||'').trim().toUpperCase().replace(/\s+/g,'');
  if(!c){$('#lerr').textContent='Écris ton code.';return}
  const b=$('#lbtn');if(b)b.disabled=true;
  try{
    const m=await Store.login(c);
    if(!m){$('#lerr').textContent='Code inconnu. Vérifie-le avec ton coach.';if(b)b.disabled=false;return}
    await enter(m);
  }catch(e){console.error(e);const l=$('#lerr');if(l)l.textContent='Connexion impossible. Vérifie ta connexion internet.';if(b)b.disabled=false}
}
async function logout(){try{await Store.logout()}catch(e){console.error(e)}S.role=null;S.me=null;S.open=null;S.fiche=null;S.ed=null;DB={ath:[],types:[],acts:[],sessions:[],exercises:[]};render()}
async function refresh(){
  if(!S.role||S.busy||S.sheet||S.ed||S.open)return;
  const y=window.scrollY;try{await reload();render();window.scrollTo(0,y)}catch(e){console.error(e)}
}

/* ===== événements ===== */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  const a=t.dataset.act,id=t.dataset.id,i=t.dataset.i!=null?+t.dataset.i:null;
  if(a==='ov'){if(e.target===t){S.sheet=null;$('#sheet').innerHTML=''}return}
  if(a==='kgin')return;
  switch(a){
    case 'logout':logout();break;
    case 'tab':S.tab=id;render();window.scrollTo(0,0);break;
    case 'wk':if(+id>0&&S.wk>=0)break;S.wk+=+id;render();break;
    case 'open':openAct(id);break;
    case 'back':S.open=null;render();break;
    case 'pick':{const a=DB.acts.find(x=>x.id===S.open);a.sessionId=id;a.title=sessOf(id).title;save();openAct(a.id);break}
    case 'rechoose':{const a=DB.acts.find(x=>x.id===S.open);a.sessionId=null;a.title=a.baseTitle||'Musculation au choix';delete S.draft[a.id];save();render();window.scrollTo(0,0);break}
    case 'chk':{const d=S.draft[S.open];d.done[i]=!d.done[i];t.setAttribute('aria-pressed',!!d.done[i]);t.textContent=d.done[i]?'✓ Fait':'Fait ?';$('#ex'+i).classList.toggle('done',!!d.done[i]);updProg();break}
    case 'kgm':case 'kgp':{const d=S.draft[S.open],v=parseFloat(String(d.kg[i]).replace(',','.'))||0;d.kg[i]=Math.max(0,v+(a==='kgp'?1:-1));$('#kg'+i).value=d.kg[i];break}
    case 'res':resSheet(id,false);break;
    case 'free':resSheet(null,true);break;
    case 'rpe':{S.sheet.rpe=i;document.querySelectorAll('.rg button').forEach((b,k)=>b.setAttribute('aria-pressed',k===i));$('#rpe-l').textContent=RPE[i];break}
    case 'res-save':saveRes();break;
    case 'close':S.sheet=null;$('#sheet').innerHTML='';break;
    case 'cf':S.calAth=id;render();break;
    case 'sf':S.sa=id;render();break;
    case 'cw':S.cw=+id;render();break;
    case 'fiche':S.fiche=id;render();window.scrollTo(0,0);break;
    case 'fback':S.fiche=null;render();break;
    case 'ntog':{const n=(athOf(S.fiche).notes||[]).find(x=>x.id===id);n.active=!n.active;save();render();break}
    case 'ndel':{const a=athOf(S.fiche);a.notes=(a.notes||[]).filter(x=>x.id!==id);save();render();toast('Information supprimée.');break}
    case 'cm':S.cal=new Date(S.cal.getFullYear(),S.cal.getMonth()+(+id),1);render();break;
    case 'day':planSheet(id);break;
    case 'plan-save':savePlan();break;
    case 'edit':editSheet(id);break;
    case 'edit-save':saveEdit();break;
    case 'edit-cancel':planSheet(S.sheet.date);break;
    case 'del':{const d=S.sheet.date;DB.acts=DB.acts.filter(x=>x.id!==id);save();render();planSheet(d);toast('Activité retirée.');break}
    case 'copy':{const x=athOf(id),msg='Cadence : ton code personnel est '+x.code+'\nOuvre : '+location.href.split('#')[0].split('?')[0];
      (navigator.clipboard?navigator.clipboard.writeText(msg):Promise.reject()).then(()=>toast('Message copié. Colle-le dans un SMS.')).catch(()=>toast('Copie impossible. Code : '+x.code));break}
    case 'askcode':askSheet('Créer un nouveau code pour '+athOf(id).name+' ? L’ancien code ne fonctionnera plus et l’athlète sera déconnecté.','newcode',id,'Nouveau code');break;
    case 'newcode':doNewCode(id);break;
    case 'askdel':askSheet('Supprimer '+athOf(id).name+' ? Son programme, ses séances faites et sa fiche seront effacés. Cette action est définitive.','delath',id,'Supprimer définitivement');break;
    case 'delath':doDelAth(id);break;
    case 'lsub':S.lsub=id;render();break;
    case 'xcat':S.xcat=id;render();break;
    case 'snew':S.ed={kind:'sess',isNew:true,draft:{id:null,title:'',description:'',visible:true,items:[]}};render();window.scrollTo(0,0);break;
    case 'sedit':{const x=sessOf(id);S.ed={kind:'sess',isNew:false,draft:clean(x)};render();window.scrollTo(0,0);break}
    case 'sdup':{const x=sessOf(id),n=clean(x);n.id=slug(x.title)+'-'+rnd(3).toLowerCase();n.title=x.title+' (copie)';n.visible=true;n.order=Math.max(0,...DB.sessions.map(z=>z.order||0))+1;DB.sessions.push(n);save();render();toast('Séance dupliquée.');break}
    case 'shide':{const x=sessOf(id);x.visible=x.visible===false;save();render();break}
    case 'asksdel':askSheet('Supprimer la séance « '+sessOf(id).title+' » ?','sdel',id,'Supprimer');break;
    case 'sdel':DB.sessions=DB.sessions.filter(x=>x.id!==id);S.sheet=null;$('#sheet').innerHTML='';save();render();toast('Séance supprimée.');break;
    case 'sadd':pickSheet();break;
    case 'pcat':S.pcat=id;pickRender();break;
    case 'padd':{const e=DB.exercises.find(x=>x.id===id);S.ed.draft.items.push({exId:id,sets:e.sets||'',reps:e.reps||'',rest:e.rest||'',load:e.load||'',section:''});S.sheet=null;$('#sheet').innerHTML='';render();window.scrollTo(0,document.body.scrollHeight);break}
    case 'sup':case 'sdown':{const it=S.ed.draft.items,j=a==='sup'?i-1:i+1;if(j<0||j>=it.length)break;[it[i],it[j]]=[it[j],it[i]];render();break}
    case 'srem':S.ed.draft.items.splice(i,1);render();break;
    case 'ssave':saveSess();break;
    case 'edcancel':S.ed=null;render();break;
    case 'enew':S.ed={kind:'exo',isNew:true,draft:{id:null,name:'',muscles:'',cat:S.xcat!=='all'?S.xcat:CATS[1],gif:'',start:'',exec:'',safety:'',engage:'',reps:'10',sets:'3',rest:'2 min',load:''}};render();window.scrollTo(0,0);break;
    case 'eedit':{const e=DB.exercises.find(x=>x.id===id);S.ed={kind:'exo',isNew:false,draft:clean(e)};render();window.scrollTo(0,0);break}
    case 'esave':saveExo();break;
    case 'askedel':askSheet('Supprimer l’exercice « '+S.ed.draft.name+' » ?','edel','x','Supprimer');break;
    case 'edel':DB.exercises=DB.exercises.filter(x=>x.id!==S.ed.draft.id);S.ed=null;S.sheet=null;$('#sheet').innerHTML='';save();render();toast('Exercice supprimé.');break;
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.act==='kgin'&&S.draft[S.open])S.draft[S.open].kg[+t.dataset.i]=t.value.replace(',','.');
  if(S.ed&&t.dataset){
    if(t.dataset.f)S.ed.draft.items[+t.dataset.i][t.dataset.f]=t.value;
    if(t.dataset.bind){S.ed.draft[t.dataset.bind]=t.value;if(t.dataset.bind==='gif'){const g=$('#gprev');if(g){g.src=t.value;g.hidden=!t.value}}}
  }
  if(t.id==='xq'){$('#xl').innerHTML=exoRows()}
  if(t.id==='pq')pickRender();
});
document.addEventListener('change',e=>{
  if(S.ed&&e.target.dataset&&e.target.dataset.bind&&e.target.tagName==='SELECT')S.ed.draft[e.target.dataset.bind]=e.target.value;
  if(e.target.id==='p-type'||e.target.name==='p-mode')syncMode('p');
  if(e.target.id==='e-type'||e.target.name==='e-mode')syncMode('e');
});
document.addEventListener('submit',e=>{
  e.preventDefault();const k=e.target.dataset.form;
  if(k==='login'){login($('#code').value)}
  if(k==='addnote'){const t=$('#n-text').value.trim();if(!t){$('#n-err').textContent='Écris un détail.';return}const a=athOf(S.fiche);a.notes=a.notes||[];a.notes.push({id:uid('n'),kind:$('#n-kind').value,date:$('#n-date').value||TODAY,text:t,active:true});save();render();toast('Information ajoutée.')}
  if(k==='addath'){const n=$('#na').value.trim();if(!n)return;addAth(n)}
  if(k==='addtype'){const n=$('#nt').value.trim();if(!n)return;const h=+(new FormData(e.target).get('hue'));DB.types.push({id:uid('ty'),name:n,h});save();render();toast('Type ajouté.')}
});
/* ===== actions asynchrones ===== */
async function addAth(n){
  const id=uid('u'),code=newCode(n);
  try{await Store.codeSet(code,{role:'athlete',athleteId:id,name:n})}catch(e){console.error(e);toast('Création impossible. Vérifie ta connexion.');return}
  DB.ath.push({id,name:n,code,notes:[]});save();render();toast('Athlète ajouté. Code : '+code);
}
async function doNewCode(id){
  const a=athOf(id),old=a.code,code=newCode(a.name);
  S.sheet=null;$('#sheet').innerHTML='';
  try{await Store.codeSet(code,{role:'athlete',athleteId:id,name:a.name});a.code=code;save();if(old)await Store.codeDel(old).catch(()=>{});await Store.dropMembers(id)}catch(e){console.error(e);toast('Changement impossible. Réessaie.');return}
  render();toast('Nouveau code : '+code);
}
async function doDelAth(id){
  const a=athOf(id);S.sheet=null;$('#sheet').innerHTML='';
  try{if(a.code)await Store.codeDel(a.code).catch(()=>{});await Store.dropMembers(id)}catch(e){console.error(e)}
  DB.acts=DB.acts.filter(x=>x.ath!==id);DB.ath=DB.ath.filter(x=>x.id!==id);save();render();toast('Athlète supprimé.');
}
function saveSess(){
  const d=S.ed.draft,err=$('#ed-err');
  if(!String(d.title||'').trim()){err.textContent='Donne un nom à la séance.';return}
  if(!d.items.length){err.textContent='Ajoute au moins un exercice.';return}
  d.title=d.title.trim();d.description=(d.description||'').trim();
  if(S.ed.isNew){d.id=slug(d.title)+'-'+rnd(3).toLowerCase();d.order=Math.max(0,...DB.sessions.map(z=>z.order||0))+1;DB.sessions.push(d)}
  else{const i=DB.sessions.findIndex(x=>x.id===d.id);DB.sessions[i]=d}
  save();S.ed=null;render();toast('Séance enregistrée.');
}
function saveExo(){
  const d=S.ed.draft,err=$('#ed-err');
  if(!String(d.name||'').trim()){err.textContent='Donne un nom à l’exercice.';return}
  if(!String(d.exec||'').trim()){err.textContent='Écris au moins l’exécution.';return}
  d.name=d.name.trim();
  if(S.ed.isNew){d.id=slug(d.name)+'-'+rnd(3).toLowerCase();DB.exercises.push(d)}
  else{const i=DB.exercises.findIndex(x=>x.id===d.id);DB.exercises[i]=d}
  save();S.ed=null;render();toast('Exercice enregistré.');
}

/* ===== démarrage ===== */
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')refresh()});
setInterval(()=>{if(document.visibilityState==='visible')refresh()},60000);
(async()=>{
  S.busy=true;render();
  try{const m=await Store.resume();if(m){await enter(m);return}}catch(e){console.error(e)}
  S.busy=false;render();
})();
</script>
