<style>
/* Mise en page : texte à gauche, vrai écran de l'appli à droite, qui change à chaque étape. */
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --ink:#17212B; --muted:#55626F; --line:#D6DCE2; --soft:#E3E8ED;

  --f-body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10161C; --surface:#18212A; --ink:#EAEEF2; --muted:#A3AFBB; --line:#2B3743; --soft:#222D37; --accent-soft:#3A2B10; --bezel:#05080B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10161C; --surface:#18212A; --ink:#EAEEF2; --muted:#A3AFBB; --line:#2B3743; --soft:#222D37; --accent-soft:#3A2B10; --bezel:#05080B; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 var(--f-body);padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
header.hd{display:flex;flex-direction:column;gap:6px}
.hd h1{font:800 clamp(28px,5vw,40px)/1.1 var(--f-head);letter-spacing:-.02em;margin:0;text-wrap:balance}
.hd p{margin:0;color:var(--muted);max-width:60ch}
.chap{display:flex;gap:8px;flex-wrap:wrap}
.chap button{font:700 15px var(--f-body);padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:flex;gap:8px;align-items:center}

.eb{font:700 12px var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}

.body b{font-weight:700}

.tip b{display:block;font:700 12px var(--f-body);letter-spacing:.08em;text-transform:uppercase;margin-bottom:2px}
.try{margin-top:4px!important;display:inline-flex;gap:8px;align-items:center;font:700 14px var(--f-body);color:var(--ink);background:var(--accent-soft);padding:6px 12px;border-radius:999px;width:max-content;max-width:100%}
.play{display:flex;gap:12px;align-items:center;max-width:52ch;background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:12px 14px;font-weight:700;box-shadow:0 0 0 4px var(--accent-soft)}
.play .ic{font-size:26px;line-height:1}
.play small{display:block;font:700 12px var(--f-body);letter-spacing:.09em;text-transform:uppercase;opacity:.75}
.play.ok{background:var(--surface);color:var(--ink);box-shadow:0 0 0 4px var(--accent);}
.live-tag{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:var(--accent-ink);font:700 11px var(--f-body);letter-spacing:.08em;padding:3px 8px;border-radius:999px;margin-left:8px;vertical-align:middle}
.phone.live{box-shadow:0 0 0 4px var(--accent),0 18px 40px rgba(10,16,22,.28)}
.phone{transition:box-shadow .3s}
.legend{margin:0 0 12px!important;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;max-width:52ch;margin:0;padding:0;list-style:none}
.legend li{display:contents}.legend span:first-child{font:700 14px var(--f-body);color:var(--muted)}
.nav{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.btn{font:700 16px var(--f-body);padding:12px 18px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn[disabled]{opacity:.4;cursor:default}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.dots{display:flex;gap:6px;margin-left:auto}
.dots i{width:22px;height:5px;border-radius:3px;background:var(--line)}
.dots i.on{background:var(--accent)}.dots i.past{background:var(--muted)}
.phonecol{position:sticky;top:16px;display:flex;flex-direction:column;align-items:center;gap:10px}
.fit{width:var(--pw,414px);height:var(--ph,806px);position:relative}
.phone{position:absolute;left:0;top:0;width:414px;height:806px;padding:12px;border-radius:44px;background:var(--bezel);box-shadow:0 18px 40px rgba(10,16,22,.28);transform:scale(var(--sc,1));transform-origin:0 0}
.screen{position:relative;width:390px;height:782px;border-radius:32px;overflow:hidden;background:#F3F5F7;isolation:isolate}
.scroller{position:absolute;inset:0;overflow:auto;scrollbar-width:none;overscroll-behavior:contain}
.scroller::-webkit-scrollbar{display:none}
.layer{position:absolute;inset:0;pointer-events:none}
.layer>*{pointer-events:auto}
.cap{font-size:14px;color:var(--muted);text-align:center;max-width:300px;min-height:44px}
.end{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:6px;max-width:52ch}
.end b{font:800 20px var(--f-head)}
@media (max-width:860px){
  .stage{grid-template-columns:minmax(0,1fr);gap:18px}
  .phonecol{position:static;order:-1}
  .dots{margin-left:0;width:100%}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>

</head>
<body>
<div class="wrap">
  <header class="hd">
    <h1>Prendre en main Cadence</h1>
    <p>Quatre étapes pour comprendre ton appli d’entraînement. L’écran du téléphone montre ce que le texte explique.</p>
  </header>
  <nav class="chap" id="chap" aria-label="Chapitres"></nav>
  <main class="stage">
    <section class="txt" aria-live="polite">
      <div class="eb" id="eb"></div>
      <h2 id="ti"></h2>
      <div class="body" id="bo"></div>
      <div class="nav">
        <button class="btn" id="prev">Précédent</button>
        <button class="btn pri" id="next">Suivant</button>
        <div class="dots" id="dots" aria-hidden="true"></div>
      </div>
    </section>
    <div class="phonecol">
      <div class="fit" id="fit"><div class="phone" id="phone"><div class="screen" id="screen"><div class="scroller" id="scroller"></div><div class="layer" id="layer"></div></div></div></div>
      <div class="cap" id="cap"></div>
    </div>
  </main>
</div>

<script>

>0 / 15 faits</small></span><span class=\"chev\" aria-hidden=\"true\">›</span></summary><div class=\"wbody\"><div class=\"prog\"><i id=\"wbar\" style=\"width: 0%;\"></i></div><p class=\"eyebrow wsec\">Mobilité · 5 min</p><div class=\"wr\" id=\"ex0\"><details><summary><span class=\"wn\"><b>Fente latérale avec rotation du buste</b><small>Hanches, haut du dos</small></span></summary><div class=\"wx\"><div><b>Exécution</b>Fais un pas de côté en fente. Pose les mains au sol. Tourne le buste vers le plafond. Garde le dos droit. Change de côté.</div></div></details><button class=\"wc\" data-act=\"chk\" data-i=\"0\" aria-pressed=\"false\" aria-label=\"Fait : Fente latérale avec rotation du buste\">✓</button></div><div class=\"wr\" id=\"ex1\"><details><summary><span class=\"wn\"><b>Rotation de hanches 90/90</b><small>Hanches</small></span></summary><div class=\"wx\"><div><b>Exécution</b>Assis, une jambe pliée devant à 90°. L’autre derrière à 90°. Fais pivoter les deux jambes d’un côté à l’autre. Garde le buste droit. Ouvre bien les hanches.</div></div></details><button class=\"wc\" data-act=\"chk\" data-i=\"1\" aria-pressed=\"false\" aria-label=\"Fait : Rotation de hanches 90/90\">✓</button></div><div class=\"wr\" id=\"ex2\"><details><summary><span class=\"wn\"><b>Genoux d’un côté à l’autre (allongé)</b><small>Bas du dos, hanches</small></span></summary><div class=\"wx\"><div><b>Exécution</b>Allongé sur le dos, genoux pliés. Laisse tomber les genoux d’un côté, puis de l’autre. Garde les épaules au sol.</div></div></details><button class=\"wc\" data-act=\"chk\" data-i=\"2\" aria-pressed=\"false\" aria-label=\"Fait : Genoux d’un côté à l’autre (allongé)\">✓</button></div><div class=\"wr\" id=\"ex3\"><details><summary><span class=\"wn\"><b>Passage de bâton</b><small>Épaules, haut du dos</small></span></summary><div class=\"wx\"><div><b>Exécution</b>Debout, bâton tenu à deux mains devant toi. Monte les bras au-dessus de la tête. Descends derrière la nuque. Garde le dos droit.</div></div></details><button class=\"wc\" data-act=\"chk\" data-i=\"3\" aria-pressed=\"false\" aria-label=\"Fait : Passage de bâton\">✓</button></div><div class=\"wr\" id=\"ex4\"><details><summary><span class=\"wn\"><b>Bras allongé à quatre pattes</b><small>Haut du dos, épaules</small></span></summary><div class=\"wx\"><div><b>Position de départ</b>À quatre pattes. Mains sous les épaules, genoux sous les hanches.</div><div><b>Exécution</b>Glisse un bras tendu sous ton corps, le plus loin possible. Descends l’épaule vers le sol. Reviens lentement. Change de bras.</div><div><b>Sécurité</b>Va doucement. Ne force pas sur l’épaule.</div><div><b>Engagement</b>Sens le haut du dos s’étirer. Respire.</div></div></details><button class=\"wc\" data-act=\"chk\" data-i=\"4\" aria-pressed=\"false\" aria-label=\"Fait : Bras allongé à quatre pattes\">✓</button></div><p class=\"eyebrow wsec\">Gainage · 5 min</p><div class=\"wr\" id=\"ex5\"><details><summary><span class=\"wn\"><b>Planche latérale avec rotation</b><small>Obliques, épaules</small></span></summary><div class=\"wx\"><div><b>Exécution</b>En planche latérale sur l’avant-bras, passe le bras libre sous le corps. Puis rouvre-le vers le haut. Ne laisse pas tomber les hanches.</div></div></details><button class=\"wc\" data-act=\"chk\" data-i=\"5\" aria-pressed=\"false\" aria-label=\"Fait : Planche latérale avec rotation\">✓</button></div><div class=\"wr\" id=\"ex6\"><details><summary><span class=\"wn\"><b>Squat profond, coudes entre les genoux</b><small>Hanches, adducteurs</small></span></summary><div class=\"wx\"><div><b>Exécution</b>Descends en squat profond. Pose les coudes à l’intérieur des genoux. Pousse doucement les genoux vers l’extérieur. Garde le dos droit.</div></div></details><button class=\"wc\" data-act=\"chk\" data-i=\"6\" aria-pressed=\"false\" aria-label=\"Fait : Squat profond, coudes entre les genoux\">✓</button></div><div class=\"wr\" id=\"ex7\"><details><summary><span class=\"wn\"><b>Cercles de genoux assis</b><small>Abdominaux, hanches</small></span></summary><div class=\"wx\"><div><b>Exécution</b>Assis en équilibre sur les fessiers, mains au sol derrière toi. Ramène les genoux vers la poitrine. Étends-les en dessinant un cercle.</div></div></details><button class=\"wc\" data-act=\"chk\" data-i=\"7\" aria-pressed=\"false\" aria-label=\"Fait : Cercles de genoux assis\">✓</button></div><div class=\"wr\" id=\"ex8\"><details><summary><span class=\"wn\"><b>Planche, hanches d’un côté à l’autre</b><small>Abdominaux, obliques</small></span></summary><div class=\"wx\"><div><b>Exécution</b>En position planche, amène les hanches d’un côté, puis de l’autre. Garde le ventre gainé et le centre du corps stable.</div></div></details><button class=\"wc\" data-act=\"chk\" data-i=\"8\" aria-pressed=\"false\" aria-label=\"Fait : Planche, hanches d’un côté à l’autre\">✓</button></div><div class=\"wr\" id=\"ex9\"><details><summary><span class=\"wn\"><b>Pont fessier au poids du corps</b><small>Fessiers, ischio-jambiers</small></span></summary><div class=\"wx\"><div><b>Position de départ</b>Allongé sur le dos. Genoux pliés, pieds à plat. Bras le long du corps.</div><div><b>Exécution</b>Pousse les hanches vers le haut. Épaules, hanches et genoux alignés. Redescends doucement.</div><div><b>Sécurité</b>Ne cambre pas le bas du dos. Nuque détendue.</div><div><b>Engagement</b>Serre les fessiers en haut. Pousse dans les talons.</div></div></details><button class=\"wc\" data-act=\"chk\" data-i=\"9\" aria-pressed=\"false\" aria-label=\"Fait : Pont fessier au poids du corps\">✓</button></div><p class=\"eyebrow wsec\">Activation cardio · 5 min</p><div class=\"wr\" id=\"ex10\"><details><summary><span class=\"wn\"><b>Planche, genou vers le coude</b><small>Abdominaux, épaules</small></span></summary><div class=\"wx\"><div><b>Exécution</b>En planche sur les avant-bras, amène un genou vers le coude du même côté. Garde les hanches basses. Alterne rapidement.</div></div></details><button class=\"wc\" data-act=\"chk\" data-i=\"10\" aria-pressed=\"false\" aria-label=\"Fait : Planche, genou vers le coude\">✓</button></div><div class=\"wr\" id=\"ex11\"><details><summary><span class=\"wn\"><b>Planche montante (avant-bras puis mains)</b><small>Épaules, triceps, abdominaux</small></span></summary><div class=\"wx\"><div><b>Exécution</b>En planche, passe des avant-bras aux mains, bras tendus, un bras après l’autre. Ne bouge pas les hanches.</div></div></details><button class=\"wc\" data-act=\"chk\" data-i=\"11\" aria-pressed=\"false\" aria-label=\"Fait : Planche montante (avant-bras puis mains)\">✓</button></div><div class=\"wr\" id=\"ex12\"><details><summary><span class=\"wn\"><b>Mountain climbers</b><small>Abdominaux, épaules, jambes</small></span></summary><div class=\"wx\"><div><b>Exécution</b>En planche sur les mains, ramène rapidement les genoux vers la poitrine en alternant les jambes. Garde le dos plat.</div></div></details><button class=\"wc\" data-act=\"chk\" data-i=\"12\" aria-pressed=\"false\" aria-label=\"Fait : Mountain climbers\">✓</button></div><div class=\"wr\" id=\"ex13\"><details><summary><span class=\"wn\"><b>Pompes</b><small>Pectoraux, triceps</small></span></summary><div class=\"wx\"><div><b>Position de départ</b>Position de planche. Mains un peu plus larges que les épaules. Corps aligné tête-hanches-talons.</div><div><b>Exécution</b>Plie les coudes pour descendre. Repousse pour remonter. Corps gainé.</div><div><b>Sécurité</b>Hanches ni affaissées, ni trop hautes. Tête dans l’alignement du dos.</div><div><b>Engagement</b>Gaine ventre et fessiers pendant tout le mouvement. Pectoraux et triceps poussent.</div></div></details><button class=\"wc\" data-act=\"chk\" data-i=\"13\" aria-pressed=\"false\" aria-label=\"Fait : Pompes\">✓</button></div><div class=\"wr\" id=\"ex14\"><details><summary><span class=\"wn\"><b>Squat au poids du corps</b><small>Quadriceps, fessiers</small></span></summary><div class=\"wx\"><div><b>Exécution</b>Debout, pieds à largeur d’épaules. Plie les hanches et les genoux, comme pour t’asseoir. Remonte en poussant dans les talons.</div></div></details><button class=\"wc\" data-act=\"chk\" data-i=\"14\" aria-pressed=\"false\" aria-label=\"Fait : Squat au poids du corps\">✓</button></div><button class=\"btn ghost sm\" data-act=\"wuall\" style=\"margin-top:10px\">Tout marquer fait</button></div></details><h2 class=\"h2\" style=\"margin:8px 0 0\">Jour B</h2><div class=\"prog\"><i id=\"pbar\" style=\"width: 0%;\"></i></div><p class=\"muted small\" id=\"pcount\" style=\"margin:0\">0 / 5 exercices faits</p><article class=\"ex\" id=\"ex15\"><div class=\"exb\"><div class=\"exh\"><h3>Kettlebell en 8</h3><button class=\"chk\" data-act=\"chk\" data-i=\"15\" aria-pressed=\"false\">Fait ?</button></div><p class=\"muted small\" style=\"margin:6px 0 0\">Abdominaux, dos, quadriceps, ischio-jambiers</p><p class=\"presc\">3 × 8 tours<small>repos 2 min</small></p><label class=\"muted small\" for=\"kg15\">Charge (kg)</label><div class=\"stepper\"><button data-act=\"kgm\" data-i=\"15\" aria-label=\"Moins 1 kg\">−</button><input id=\"kg15\" data-act=\"kgin\" data-i=\"15\" inputmode=\"decimal\" value=\"3\"><button data-act=\"kgp\" data-i=\"15\" aria-label=\"Plus 1 kg\">+</button></div><details class=\"how\"><summary><span class=\"i\" aria-hidden=\"true\">i</span>Voir les consignes</summary><div><b>Position de départ</b>Debout en fente ou squat partiel. Kettlebell tenu à deux mains devant toi.</div><div><b>Exécution</b>Passe le kettlebell d’une main à l’autre. Dessine un « 8 » autour et entre les jambes.</div><div><b>Sécurité</b>Genoux toujours fléchis. Ne te penche pas trop en avant.</div><div><b>Engagement</b>Gaine le ventre et le bas du dos. Quadriceps actifs pour tenir la position basse.</div></details></div></article><article class=\"ex\" id=\"ex16\"><div class=\"exb\"><div class=\"exh\"><h3>Tirage poulie à une main (assis)</h3><button class=\"chk\" data-act=\"chk\" data-i=\"16\" aria-pressed=\"false\">Fait ?</button></div><p class=\"muted small\" style=\"margin:6px 0 0\">Deltoïdes, triceps, grand dorsal</p><p class=\"presc\">3 × 10<small>repos 2 min</small></p><label class=\"muted small\" for=\"kg16\">Charge (kg) · conseil : 4 RIR</label><div class=\"stepper\"><button data-act=\"kgm\" data-i=\"16\" aria-label=\"Moins 1 kg\">−</button><input id=\"kg16\" data-act=\"kgin\" data-i=\"16\" inputmode=\"decimal\" value=\"\"><button data-act=\"kgp\" data-i=\"16\" aria-label=\"Plus 1 kg\">+</button></div><details class=\"how\"><summary><span class=\"i\" aria-hidden=\"true\">i</span>Voir les consignes</summary><div><b>Position de départ</b>Assis face à la poulie. Genoux légèrement fléchis. Dos droit. Une main tient la poignée.</div><div><b>Exécution</b>Tire la poignée vers la hanche. Recule le coude. Reviens en contrôlant.</div><div><b>Sécurité</b>N’arrondis pas le dos pour tirer plus fort. Pas de rotation du buste.</div><div><b>Engagement</b>Gaine ventre et bas du dos. Contracte le dos et le biceps en fin de tirage.</div></details></div></article><article class=\"ex\" id=\"ex17\"><div class=\"exb\"><div class=\"exh\"><h3>Fentes aux haltères</h3><button class=\"chk\" data-act=\"chk\" data-i=\"17\" aria-pressed=\"false\">Fait ?</button></div><p class=\"muted small\" style=\"margin:6px 0 0\">Quadriceps, ischio-jambiers, fessiers</p><p class=\"presc\">3 × 10<small>repos 2 min</small></p><label class=\"muted small\" for=\"kg17\">Charge (kg)</label><div class=\"stepper\"><button data-act=\"kgm\" data-i=\"17\" aria-label=\"Moins 1 kg\">−</button><input id=\"kg17\" data-act=\"kgin\" data-i=\"17\" inputmode=\"decimal\" value=\"1\"><button data-act=\"kgp\" data-i=\"17\" aria-label=\"Plus 1 kg\">+</button></div><details class=\"how\"><summary><span class=\"i\" aria-hidden=\"true\">i</span>Voir les consignes</summary><div><b>Position de départ</b>Debout, un haltère dans chaque main. Bras le long du corps.</div><div><b>Exécution</b>Fais un grand pas en avant. Descends en pliant les deux genoux. Repousse rt</b>Allongé sur le dos, genoux pliés, pieds à plat. Charge posée sur les hanches.</div><div><b>Exécution</b>Pousse les hanches vers le haut jusqu’à l’alignement genoux-hanches-épaules. Redescends en contrôlant.</div><div><b>Sécurité</b>Ne creuse pas le bas du dos.</div><div><b>Engagement</b>Serre fort les fessiers en haut. Gaine les abdominaux pour ne pas creuser ni arrondir le ventre.</div></details></div></article></main><div class=\"fixed act-bar\"><div class=\"in\"><button class=\"btn amber block\" data-act=\"res\" data-id=\"d32\">Terminer et donner mon ressenti</button></div></div>", "nav": "", "sheet": ""}, "res0": {"main": "<header class=\"top\"><div class=\"in\"><button class=\"back\" data-act=\"back\" aria-label=\"Retour\">‹</button><h1>Jour B<small>samedi 7 novembre</small></h1></div></header><main class=\"in main\"><div><span style=\"--h:28\" class=\"t\"><span class=\"tag\">Musculation</span></span></div><div><button class=\"btn ghost sm\" data-act=\"rechoose\">Changer de séance</button></div><details class=\"wu\" id=\"wu\"><summary><span class=\"wh\"><b>Échauffement</b><small id=\"wcount\">0 / 15 faits</small></span><span class=\"chev\" aria-hidden=\"true\">›</span></summary><div class=\"wbody\"><div class=\"prog\"><i id=\"wbar\" style=\"width: 0%;\"></i></div><p class=\"eyebrow wsec\">Mobilité · 5 min</p><div class=\"wr\" id=\"ex0\"><details><summary><span class=\"wn\"><b>Fente latérale avec rotation du buste</b><small>Hanches, haut du dos</small></span></summary><div class=\"wx\"><div><b>Exécution</b>Fais un pas de côté en fente. Pose les mains au sol. Tourne le buste vers le plafond. Garde le dos droit. Change de côté.</div></div></details><button class=\"wc\" data-act=\"chk\" data-i=\"0\" aria-pressed=\"false\" aria-label=\"Fait : Fente latérale avec rotation du buste\">✓</button></div><div class=\"wr\" id=\"ex1\"><details><summary><span class=\"wn\"><b>Rotation de hanches 90/90</b><small>Hanches</small></span></summary><div class=\"wx\"><div><b>Exécution</b>Assis, une jambe pliée devant à 90°. L’autre derrière à 90°. Fais pivoter les deux jambes d’un côté à l’autre. Garde le buste droit. Ouvre bien les hanches.</div></div></details><button class=\"wc\" data-act=\"chk\" data-i=\"1\" aria-pressed=\"false\" aria-label=\"Fait : Rotation de hanches 90/90\">✓</button></div><div class=\"wr\" id=\"ex2\"><details><summary><span class=\"wn\"><b>Genoux d’un côté à l’autre (allongé)</b><small>Bas du dos, hanches</small></span></summary><div class=\"wx\"><div><b>Exécution</b>Allongé sur le dos, genoux pliés. Laisse tomber les genoux d’un côté, puis de l’autre. Garde les épaules au sol.</div></div></details><button class=\"wc\" data-act=\"chk\" data-i=\"2\" aria-pressed=\"false\" aria-label=\"Fait : Genoux d’un côté à l’autre (allongé)\">✓</button></div><div class=\"wr\" id=\"ex3\"><details><summary><span class=\"wn\"><b>Passage de bâton</b><small>Épaules, haut du dos</small></span></summary><div class=\"wx\"><div><b>Exécution</b>Debout, bâton tenu à deux mains devant toi. Monte les bras au-dessus de la tête. Descends derrière la nuque. Garde le dos droit.</div></div></details><button class=\"wc\" data-act=\"chk\" data-i=\"3\" aria-pressed=\"false\" aria-label=\"Fait : Passage de bâton\">✓</button></div><div class=\"wr\" id=\"ex4\"><details><summary><span class=\"wn\"><b>Bras allongé à quatre pattes</b><small>Haut du dos, épaules</small></span></summary><div class=\"wx\"><div><b>Position de départ</b>À quatre pattes. Mains sous les épaules, genoux sous les hanches.</div><div><b>Exécution</b>Glisse un bras tendu sous ton corps, le plus loin possible. Descends l’épaule vers le sol. Reviens lentement. Change de bras.</div><div><b>Sécurité</b>Va doucement. Ne force pas sur l’épaule.</div><div><b>Engagement</b>Sens le haut du dos s’étirer. Respire.</div></div></details><button class=\"wc\" data-act=\"chk\" data-i=\"4\" aria-pressed=\"false\" aria-label=\"Fait : Bras allongé à quatre pattes\">✓</button></div><p class=\"eyebrow a-label=\"Retour\">‹</button><h1>Jour B<small>samedi 7 novembre</small></h1></div></header><main class=\"in main\"><div><span style=\"--h:28\" class=\"t\"><span class=\"tag\">Musculation</span></span></div><div><button class=\"btn ghost sm\" data-act=\"rechoose\">Changer de séance</button></div><details class=\"wu\" id=\"wu\"><summary><span class=\"wh\"><b>Échauffement</b><small id=\"wcount\">0 / 15 faits</small></span><span class=\"chev\" aria-hidden=\"true\">›</span></summary><div class=\"wbody\"><div class=\"prog\"><i id=\"wbar\" style=\"width: 0%;\"></i></div><p class=\"eyebrow wsec\">Mobilité · 5 min</p><div class=\"wr\" id=\"ex0\"><details><summary><span class=\"wn\"><b>Fente latérale avec rotation du buste</b><small>Hanches, haut du dos</small></span></summary><div class=\"wx\"><div><b>Exécution</b>Fais un pas de côté en fente. Pose les mains au sol. Tourne le buste vers le plafond. Garde le dos droit. Change de côté.</div></div></details><button class=\"wc\" data-act=\"chk\" data-i=\"0\" aria-pressed=\"false\" aria-label=\"Fait : Fente latérale avec rotation du buste\">✓</button></div><div class=\"wr\" id=\"ex1\"><details><summary><span class=\"wn\"><b>Rotation de hanches 90/90</b><small>Hanches</small></span></summary><div class=\"wx\"><div><b>Exécution</b>Assis, une jambe pliée devant à 90°. L’autre derrière à 90°. Fais pivoter les deux jambes d’un côté à l’autre. Garde le buste droit. Ouvre bien les hanches.</div></div></details><button class=\"wc\" data-act=\"chk\" data-i=\"1\" aria-pressed=\"false\" aria-label=\"Fait : Rotation de hanches 90/90\">✓</button></div><div class=\"wr\" id=\"ex2\"><details><summary><span class=\"wn\"><b>Genoux d’un côté à l’autre (allongé)</b><small>Bas du dos, hanches</small></span></summary><div class=\"wx\"><div><b>Exécution</b>Allongé sur le dos, genoux pliés. Laisse tomber les genoux d’un côté, puis de l’autre. Garde les épaules au sol.</div></div></details><button class=\"wc\" data-act=\"chk\" data-i=\"2\" aria-pressed=\"false\" aria-label=\"Fait : Genoux d’un côté à l’autre (allongé)\">✓</button></div><div class=\"wr\" id=\"ex3\"><details><summary><span class=\"wn\"><b>Passage de bâton</b><small>Épaules, haut du dos</small></span></summary><div class=\"wx\"><div><b>Exécution</b>Debout, bâton tenu à deux mains devant toi. Monte les bras au-dessus de la tête. Descends derrière la nuque. Garde le dos droit.</div></div></details><button class=\"wc\" data-act=\"chk\" data-i=\"3\" aria-pressed=\"false\" aria-label=\"Fait : Passage de bâton\">✓</button></div><div class=\"wr\" id=\"ex4\"><details><summary><span class=\"wn\"><b>Bras allongé à quatre pattes</b><small>Haut du dos, épaules</small></span></summary><div class=\"wx\"><div><b>Position de départ</b>À quatre pattes. Mains sous les épaules, genoux sous les hanches.</div><div><b>Exécution</b>Glisse un bras tendu sous ton corps, le plus loin possible. Descends l’épaule vers le sol. Reviens lentement. Change de bras.</div><div><b>Sécurité</b>Va doucement. Ne force pas sur l’épaule.</div><div><b>Engagement</b>Sens le haut du dos s’étirer. Respire.</div></div></details><button class=\"wc\" data-act=\"chk\" data-i=\"4\" aria-pressed=\"false\" aria-label=\"Fait : Bras allongé à quatre pattes\">✓</button></div><p class=\"eyebrow wsec\">Gainage · 5 min</p><div class=\"wr\" id=\"ex5\"><details><summary><span class=\"wn\"><b>Planche latérale avec rotation</b><small>Obliques, épaules</small></span></summary><div class=\"wx\"><div><b>Exécution</b>En planche latérale sur l’avant-bras, passe le bras libre sous le corps. Puis rouvre-le vers le haut. Ne laisse pas tomber les hanches.</div></div></details><button class=\"wc\" data-act=\"chk\" data-i=\"5\" aria-pressed=\"false\" aria-label=\"Fait : Planche latérale avec rotation\">✓</button></div><div class=\"wr\" id=\"ex6\"><details><summary><span class=\"wn\"><b>Squat profond, coudes entre les genoux</b><small>Hanches, adducteurs</small></span></summary><div class=\"wx\"><div><b>Exécution</b>Descends en squat profond. Pose les coudes à l’intérieur des genoux. Pousse doucement les genoux vers l’extérieur. Garde le dos droit.</div></div></details><button class=\"wc\" data-act=\"chk\" data-i=\"6\" aria-pressed=\"false\" aria-label=\"Fait : Squat profond, coudes entre les genoux\">✓</button></div><div class=\"wr\" id=\"ex7\"><details><summary><span class=\"wn\"><b>Cercles de genoux assis</b><small>Abdominaux, hanches</small></span></summary><div class=\"wx\"><div><b>Exécution</b>Assis en équilibre sur les fessiers, mains au sol derrière toi. Ramène les genoux vers la poitrine. Étends-les en dessinant un cercle.</div></div></details><button class=\"wc\" data-act=\"chk\" data-i=\"7\" aria-pressed=\"false\" aria-label=\"Fait : Cercles de genoux assis\">✓</button></div><div class=\"wr\" id=\"ex8\"><details><summary><span class=\"wn\"><b>Planche, hanches d’un côté à l’autre</b><small>Abdominaux, obliques</small></span></summary><div class=\"wx\"><div><b>Exécution</b>En position planche, amène les hanches d’un côté, puis de l’autre. Garde le ventre gainé et le centre du corps stable.</div></div></details><button class=\"wc\" data-act=\"chk\" data-i=\"8\" aria-pressed=\"false\" aria-label=\"Fait : Planche, hanches d’un côté à l’autre\">✓</button></div><div class=\"wr\" id=\"ex9\"><details><summary><span class=\"wn\"><b>Pont fessier au poids du corps</b><small>Fessiers, ischio-jambiers</small></span></summary><div class=\"wx\"><div><b>Position de départ</b>Allongé sur le dos. Genoux pliés, pieds à plat. Bras le long du corps.</div><div><b>Exécution</b>Pousse les hanches vers le haut. Épaules, hanches et genoux alignés. Redescends doucement.</div><div><b>Sécurité</b>Ne cambre pas le bas du dos. Nuque détendue.</div><div><b>Engagement</b>Serre les fessiers en haut. Pousse dans les talons.</div></div></details><button class=\"wc\" data-act=\"chk\" data-i=\"9\" aria-pressed=\"false\" aria-label=\"Fait : Pont fessier au poids du corps\">✓</button></div><p class=\"eyebrow wsec\">Activation cardio · 5 min</p><div class=\"wr\" id=\"ex10\"><details><summary><span class=\"wn\"><b>Planche, genou vers le coude</b><small>Abdominaux, épaules</small></span></summary><div class=\"wx\"><div><b>Exécution</b>En planche sur les avant-bras, amène un genou vers le coude du même côté. Garde les hanches basses. Alterne rapidement.</div></div></details><button class=\"wc\" data-act=\"chk\" data-i=\"10\" aria-pressed=\"false\" aria-label=\"Fait : Planche, genou vers le coude\">✓</button></div><div class=\"wr\" id=\"ex11\"><details><summary><span class=\"wn\"><b>Planche montante (avant-bras puis mains)</b><small>Épaules, triceps, abdominaux</small></span></summary><div class=\"wx\"><div><b>Exécution</b>En planche, passe des avant-bras aux mains, bras tendus, un bras après l’autre. Ne bouge pas les hanches.</div></div></details><button class=\"wc\" data-act=\"chk\" data-i=\"11\" aria-pressed=\"false\" aria-label=\"Fait : Planche montante (avant-bras puis mains)\">✓</button></div><div class=\"wr\" id=\"ex12\"><details><summary><span class=\"wn\"><b>Mountain climbers</b><small>Abdominaux, épaules, jambes</small></span></summary><div class=\"wx\"><div><b>Exécution</b>En planche sur les mains, ramène rapidement les genoux vers la poitrine en alternant les jambes. Garde le dos plat.</div></div></details><button class=\"wc\" data-act=\"chk\" data-i=\"12\" aria-pressed=\"false\" aria-label=\"Fait : Mountain climbers\">✓</button></div><div class=\"wr\" id=\"ex13\"><details><summary><span class=\"wn\"><b>Pompes</b><small>Pectoraux, triceps</small></span></summary><div class=\"wx\"><div><b>Position de départ</b>Position de planche. Mains un peu plus larges que les épaules. Corps aligné tête-hanches-talons.</div><div><b>Exécution</b>Plie les coudes pour descendre. Repousse pour remonter. Corps gainé.</div><div><b>Sécurité</b>Hanches ni affaissées, ni trop hautes. Tête dans l’alignement du dos.</div><div><b>Engagement</b>Gaine ventre et fessiers pendant tout le mouvement. Pectoraux et triceps poussent.</div></div></details><button class=\"wc\" data-act=\"chk\" data-i=\"13\" aria-pressed=\"false\" aria-label=\"Fait : Pompes\">✓</button></div><div class=\"wr\" id=\"ex14\"><details><summary><span class=\"wn\"><b>Squat au poids du corps</b><small>Quadriceps, fessiers</small></span></summary><div class=\"wx\"><div><b>Exécution</b>Debout, pieds à largeur d’épaules. Plie les hanches et les genoux, comme pour t’asseoir. Remonte en poussant dans les talons.</div></div></details><button class=\"wc\" data-act=\"chk\" data-i=\"14\" aria-pressed=\"false\" aria-label=\"Fait : Squat au poids du corps\">✓</button></div><button class=\"btn ghost sm\" data-act=\"wuall\" style=\"margin-top:10px\">Tout marquer fait</button></div></details><h2 class=\"h2\" style=\"margin:8px 0 0\">Jour B</h2><div class=\"prog\"><i id=\"pbar\" style=\"width: 0%;\"></i></div><p class=\"muted small\" id=\"pcount\" style=\"margin:0\">0 / 5 exercices faits</p><article class=\"ex\" id=\"ex15\"><div class=\"exb\"><div class=\"exh\"><h3>Kettlebell en 8</h3><button class=\"chk\" data-act=\"chk\" data-i=\"15\" aria-pressed=\"false\">Fait ?</button></div><p class=\"muted small\" style=\"margin:6px 0 0\">Abdominaux, dos, quadriceps, ischio-jambiers</p><p class=\"presc\">3 × 8 tours<small>repos 2 min</small></p><label class=\"muted small\" for=\"kg15\">Charge (kg)</label><div class=\"stepper\"><button data-act=\"kgm\" data-i=\"15\" aria-label=\"Moins 1 kg\">−</button><input id=\"kg15\" data-act=\"kgin\" data-i=\"15\" inputmode=\"decimal\" value=\"3\"><button data-act=\"kgp\" data-i=\"15\" aria-label=\"Plus 1 kg\">+</button></div><details class=\"how\"><summary><span class=\"i\" aria-hidden=\"true\">i</span>Voir les consignes</summary><div><b>Position de départ</b>Debout en fente ou squat partiel. Kettlebell tenu à deux mains devant toi.</div><div><b>Exécution</b>Passe le kettlebell d’une main à l’autre. Dessine un « 8 » autour et entre les jambes.</div><div><b>Sécurité</b>Genoux toujours fléchis. Ne te penche pas trop en avant.</div><div><b>Engagement</b>Gaine le ventre et le bas du dos. Quadriceps actifs pour tenir la position basse.</div></details></div></article><article class=\"ex\" id=\"ex16\"><div class=\"exb\"><div class=\"exh\"><h3>Tirage poulie à une main (assis)</h3><button class=\"chk\" data-act=\"chk\" data-i=\"16\" aria-pressed=\"false\">Fait ?</button></div><p class=\"muted small\" style=\"margin:6px 0 0\">Deltoïdes, triceps, grand dorsal</p><p class=\"presc\">3 × 10<small>repos 2 min</small></p><label class=\"muted small\" for=\"kg16\">Charge (kg) · conseil : 4 RIR</label><div class=\"stepper\"><button data-act=\"kgm\" data-i=\"16\" aria-label=\"Moins 1 kg\">−</button><input id=\"kg16\" data-act=\"kgin\" data-i=\"16\" inputmode=\"decimal\" value=\"\"><button data-act=\"kgp\" data-i=\"16\" aria-label=\"Plus 1 kg\">+</button></div><details class=\"how\"><summary><span class=\"i\" aria-hidden=\"true\">i</span>Voir les consignes</summary><div><b>Position de départ</b>Assis face à la poulie. Genoux légèrement fléchis. Dos droit. Une main tient la poignée.</div><div><b>Exécution</b>Tire la poignée vers la hanche. Recule le coude. Reviens en contrôlant.</div><div><b>Sécurité</b>N’arrondis pas le dos pour tirer plus fort. Pas de rotation du buste.</div><div><b>Engagement</b>Gaine ventre et bas du dos. Contracte le dos et le biceps en fin de tirage.</div></details></div></article><article class=\"ex\" id=\"ex17\"><div class=\"exb\"><div class=\"exh\"><h3>Fentes aux haltères</h3><button class=\"chk\" data-act=\"chk\" data-i=\"17\" aria-pressed=\"false\">Fait ?</button></div><p class=\"muted small\" style=\"margin:6px 0 0\">Quadriceps, ischio-jambiers, fessiers</p><p class=\"presc\">3 × 10<small>repos 2 min</small></p><label class=\"muted small\" for=\"kg17\">Charge (kg)</label><div class=\"stepper\"><button data-act=\"kgm\" data-i=\"17\" aria-label=\"Moins 1 kg\">−</button><input id=\"kg17\" data-act=\"kgin\" data-i=\"17\" inputmode=\"dec }
function typeCode(el,txt){
  clearInterval(timer);el.value='';let i=0;
  timer=setInterval(()=>{i++;el.value=txt.slice(0,i);if(i>=txt.length)clearInterval(timer)},70);
}
function show(i,instant){
  cur=Math.max(0,Math.min(STEPS.length-1,i));const st=STEPS[cur];
  clearInterval(timer);
  $('eb').innerHTML='Chapitre '+(st.c+1)+' · '+CH[st.c]+((st.rpe||st.free)?'<span class="live-tag">INTERACTIF</span>':'');$('phone').classList.toggle('live',!!(st.rpe||st.free));$('ti').textContent=st.t;$('bo').innerHTML=st.b;$('cap').textContent=st.cap||'';$('cap').style.fontWeight=(st.rpe||st.free)?'700':'';$('cap').style.color=(st.rpe||st.free)?'var(--ink)':'';
  document.querySelectorAll('#chap button').forEach((b,k)=>{b.setAttribute('aria-current',k===st.c);});
  $('prev').disabled=cur===0;$('next').textContent=cur===STEPS.length-1?'Recommencer':'Suivant';
  $('dots').innerHTML=STEPS.map((s,k)=>'<i class="'+(k===cur?'on':k<cur?'past':'')+'"></i>').join('');
  setSnap(st.snap);
  if(st.nav)$n.querySelectorAll('button').forEach(b=>b.removeAttribute('aria-current'));
  if(st.nav==='hist')$n.querySelectorAll('button').forEach(b=>{if(b.dataset.id==='hist')b.setAttribute('aria-current','page')});
  // ancre pour la carte réussites
  const sc=$('scroller');sc.scrollTop=0;
  const ach=[...root.querySelectorAll('h2')].find(h=>h.textContent.includes('Mes réussites'));
  if(ach&&ach.closest('.card'))ach.closest('.card').id='ach';
  clearHl();
  requestAnimationFrame(()=>{
    const el=q(st.hl);
    if(st.scroll&&st.scroll!=='top'){const lt=lroot.querySelector(st.scroll);if(lt){const sh=lt.closest('.sh');if(sh){const y=lt.getBoundingClientRect().top-sh.getBoundingClientRect().top+sh.scrollTop-40;sh.scrollTo({top:Math.max(0,y),behavior:'smooth'})}}const t=root.querySelector(st.scroll);if(t){const y=t.getBoundingClientRect().top-sc.getBoundingClientRect().top+sc.scrollTop-96;sc.scrollTo({top:Math.max(0,y),behavior:instant||matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'})}}
    if(el){el.classList.add('tut-hl');}
    setTimeout(()=>{const e2=q(st.hl);if(e2&&!st.type&&!st.rpe)place(e2);if(st.rpe){const b7=lroot.querySelector('.rg button:nth-child(8)')||root.querySelector('.rg button:nth-child(8)');if(b7)place(b7)}},instant?0:450);
    if(st.type){const inp=root.getElementById('code');if(inp){inp.removeAttribute('value');setTimeout(()=>typeCode(inp,st.type),400);const b=root.getElementById('lbtn');}}
  });
}
function rpeDone(n){const p=$('play');if(!p||!STEPS[cur].rpe)return;p.classList.add('ok');p.innerHTML='<span class="ic">✅</span><span><small>Bien joué</small>'+n+' = '+RPE[n].toLowerCase()+'. Essaie un autre chiffre.</span>'}
function playSet(ic,sm,tx,ok){const p=$('play');if(!p)return;p.classList.toggle('ok',!!ok);p.innerHTML='<span class="ic">'+ic+'</span><span><small>'+sm+'</small>'+tx+'</span>'}
function freeClick(e){
  if(!STEPS[cur].free)return;const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  if(a==='free'){$s.innerHTML=SNAPS.free.sheet;$s.querySelectorAll('.ov').forEach(o=>o.removeAttribute('data-act'));clearHl();
    const f=lroot.getElementById('f-type');if(f)f.classList.add('tut-hl');
    playSet('✍️','Étape suivante','Choisis un type, écris un titre, touche un chiffre de RPE, puis « Enregistrer ».')}
  else if(a==='close'||a==='res-save'){$s.innerHTML='';const bt=q('[data-act=free]');if(bt){bt.classList.add('tut-hl');place(bt)}
    if(a==='res-save')playSet('✅','Bien joué','Voilà. Dans l’appli, l’activité apparaît dans ta semaine. Tu peux recommencer.',true);
    else playSet('👆','À toi de jouer','Touche « + Activité non prévue » sur l’écran du téléphone.')}
}
root.addEventListener('click',freeClick);lroot.addEventListener('click',freeClick);
// RPE interactif
root.addEventListener('click',e=>{
  const b=e.target.closest('[data-act=rpe]');if(!b||!(STEPS[cur].rpe||STEPS[cur].free))return;
  const n=+b.dataset.i;root.querySelectorAll('.rg button').forEach((x,k)=>x.setAttribute('aria-pressed',k===n));
  const l=root.getElementById('rpe-l');if(l)l.textContent=RPE[n];$tap.hidden=true;rpeDone(n);
});
lroot.addEventListener('click',e=>{
  const b=e.target.closest('[data-act=rpe]');if(!b||!(STEPS[cur].rpe||STEPS[cur].free))return;
  const n=+b.dataset.i;lroot.querySelectorAll('.rg button').forEach((x,k)=>x.setAttribute('aria-pressed',k===n));
  const l=lroot.getElementById('rpe-l');if(l)l.textContent=RPE[n];$tap.hidden=true;rpeDone(n);
});
$('chap').innerHTML=CH.map((c,k)=>'<button data-c="'+k+'"><small>'+(k+1)+'</small>'+c+'</button>').join('');
$('chap').addEventListener('click',e=>{const b=e.target.closest('button');if(b)show(STEPS.findIndex(s=>s.c===+b.dataset.c))});
$('prev').onclick=()=>show(cur-1);$('next').onclick=()=>show(cur===STEPS.length-1?0:cur+1);
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')show(cur+1);if(e.key==='ArrowLeft')show(cur-1)});
// taille du téléphone selon la place disponible
function fit(){
  const col=document.querySelector('.phonecol'),avail=Math.min(col.parentElement.clientWidth,window.innerWidth-32);
  const narrow=window.innerWidth<=860,sc=narrow?Math.min(1,avail/414,0.84):Math.min(1,(window.innerHeight-48)/806);
  const s=Math.max(.5,sc);const f=$('fit');f.style.setProperty('--sc',s);f.style.setProperty('--pw',(414*s)+'px');f.style.setProperty('--ph',(806*s)+'px');
  f.querySelector('.phone').style.setProperty('--sc',s);
}
addEventListener('resize',fit);fit();show(0,true);
</script>
